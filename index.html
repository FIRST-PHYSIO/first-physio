<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1a2233; --sub:#68738a; --line:#e3e8f0;
  --brand:#1e5eff; --brand-soft:#eaf0ff; --ok:#0eab6b; --ok-soft:#e5f8f0;
  --warn:#e8930c; --warn-soft:#fdf3e2; --bad:#e0364b; --bad-soft:#fdeaed;
  --violet:#7048e8; --violet-soft:#f0ebfd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#101a33;color:#fff;padding:0 16px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:50}
header h1{font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
header h1 span{color:#7ea2ff}
nav{display:flex;gap:2px;height:100%;overflow-x:auto}
nav button{background:none;border:none;color:#9aa7c4;font-size:13.5px;font-weight:600;padding:0 12px;cursor:pointer;height:100%;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:#fff;border-bottom-color:var(--brand)}
nav button:hover{color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync-dot{font-size:11.5px;color:#9aa7c4;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync-dot i{width:8px;height:8px;border-radius:50%;background:#98a1b3;display:inline-block}
.sync-dot.on i{background:#3ecf8e}
.sync-dot.err i{background:#ff6b81}
.bell{position:relative;background:none;border:none;color:#cdd6ea;font-size:18px;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-8px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font-size:12px;color:var(--sub);font-weight:500}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k-label{font-size:12px;color:var(--sub);font-weight:600}
.kpi .k-val{font-size:23px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .k-sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.kpi.alert{border-color:#f3c98b;background:#fffaf1}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#f7f9fd}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-blue{background:var(--brand-soft);color:var(--brand)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-vio{background:var(--violet-soft);color:var(--violet)}
.b-gray{background:#eef1f6;color:var(--sub)}
.progress{background:#edf0f6;border-radius:99px;height:8px;width:100px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress i.full{background:var(--bad)}
.progress i.near{background:var(--warn)}
button.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.btn.ghost:hover{background:#f5f7fb;filter:none}
button.btn.danger{background:var(--bad)}
button.btn.warn{background:var(--warn)}
button.btn.small{padding:5px 10px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid #cdd5e1;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b9ccff;border-color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.day-tabs{display:flex;gap:4px;flex-wrap:wrap}
.day-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--sub);font-family:inherit}
.day-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit}
.seg button.on{background:var(--brand);color:#fff}
.sched-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.sched{border-collapse:collapse;width:100%}
.sched th{background:#f8fafd;padding:8px 6px;text-align:center;border-bottom:2px solid var(--line);border-right:1px solid var(--line);font-size:12px}
.sched td{border:1px solid var(--line);padding:3px;min-width:110px;height:44px;vertical-align:top;cursor:pointer}
.sched td:hover{background:#f5f8ff}
.sched td.time{background:#f8fafd;font-weight:700;color:var(--sub);text-align:center;min-width:56px;cursor:default;font-size:12px}
.sched td.blocked{background:repeating-linear-gradient(45deg,#f0f2f6,#f0f2f6 6px,#e6e9f0 6px,#e6e9f0 12px);cursor:pointer}
.sched td.past-col{background:#fbfcfe}
.chip{border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;margin-bottom:2px;line-height:1.3;cursor:pointer}
.chip .cnt{font-weight:800}
.chip .tt{opacity:.75;font-weight:700}
.chip.booked{background:var(--brand-soft);color:#1a49c2;border:1px dashed #9db7f5}
.chip.done{background:var(--ok-soft);color:#087a4c;border:1px solid #bfead7}
.chip.noshow{background:var(--bad-soft);color:var(--bad);border:1px solid #f5c6cd}
.chip.cancelled{background:#f0f2f6;color:#98a1b3;border:1px solid var(--line);text-decoration:line-through}
.chip.late_cancel{background:var(--warn-soft);color:#8a5a08;border:1px solid #f3d9a8}
.chip.over{outline:2px solid var(--bad)}
.chip.gxchip{background:#1233a8;color:#fff;border:1px solid #1233a8}
.chip.consult{background:#fff4e6;color:#b45309;border:1px solid #f5c98b}
.chip.personal{background:#e9ecf3;color:#39445c;border:1px solid #d3d9e5;font-style:italic}
.pt-cnt td{background:#f8fafd;font-size:11px;padding:4px 6px;cursor:default}
.sched td.time,.sched th.time{position:sticky;left:0;z-index:3;background:#f8fafd}
.sched.grid td{min-width:92px;padding:2px}
.sched.grid th.sub{font-size:11px;padding:4px 2px;background:#fff}
.notice-row td{background:linear-gradient(180deg,#eef4ff,#e6edff);color:#12306e;font-weight:800;font-size:13.5px;padding:8px 10px;text-align:center;cursor:pointer;border-bottom:2px solid #b9ccff;line-height:1.45}
.notice-row td:hover{filter:brightness(.97)}
.notice-row td .ph{color:#8fa4cc;font-weight:600}
.wd-row{display:flex;gap:4px;flex-wrap:wrap}
.wd-row label{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;font-weight:700;cursor:pointer}
.wd-row label.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:36px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.frm input,.frm select,.frm textarea{width:100%}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.note{font-size:12.5px;color:var(--sub);background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6}
.note.warn{background:var(--warn-soft);border-color:#f3d9a8;color:#8a5a08}
.note.bad{background:var(--bad-soft);border-color:#f5c6cd;color:#a1202f}
.note.ok{background:var(--ok-soft);border-color:#bfead7;color:#087a4c}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar{width:70%;max-width:48px;background:linear-gradient(180deg,#4d82ff,#1e5eff);border-radius:6px 6px 2px 2px;min-height:2px}
.bar-col .bv{font-size:11px;font-weight:700}
.bar-col .bl{font-size:11px;color:var(--sub)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.help p{margin-bottom:10px;line-height:1.75}
.help h4{margin:16px 0 6px;font-size:14px}
.help .src{color:var(--sub);font-size:12px}
.help ol{margin:6px 0 10px 20px;line-height:1.9}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.empty{color:var(--sub);text-align:center;padding:22px;font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.hist{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.hist table td,.hist table th{padding:6px 10px;font-size:12.5px}
.trainer-tag{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.trainer-tag b{cursor:pointer;color:var(--bad)}
.duty-line{margin-top:3px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.duty-b{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 5px}
code.sql{display:block;background:#101a33;color:#cfe0ff;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;line-height:1.6;margin:8px 0}
.block-grid{border-collapse:collapse}
.block-grid td,.block-grid th{border:1px solid var(--line);padding:0;text-align:center;font-size:11.5px}
.block-grid td{width:44px;height:26px;cursor:pointer}
.block-grid td.b{background:repeating-linear-gradient(45deg,#f6d7db,#f6d7db 5px,#f0c2c8 5px,#f0c2c8 10px)}
.evt{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5}
.evt .t{color:var(--sub);font-size:11px}
/* ---------- 모바일 ---------- */
@media(max-width:700px){
  header{height:50px;padding:0 10px;gap:8px}
  header h1{font-size:13px}
  nav button{padding:0 8px;font-size:12.5px}
  main{padding:10px}
  .toolbar{gap:6px}
  .toolbar .btn{padding:7px 10px;font-size:12px}
  .grid-kpi{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi .k-val{font-size:19px}
  .card{padding:12px;border-radius:10px}
  .sched td{min-width:96px;height:40px}
  .sched td.time{min-width:44px}
  .modal{padding:16px;border-radius:12px}
  .frm{grid-template-columns:1fr}
  .overlay{padding:14px 8px}
  th,td{padding:7px 6px}
  .progress{width:64px}
  .slot{width:calc(25% - 5px)}
  input,select,textarea{font-size:16px} /* iOS 확대 방지 */
}
/* 회원 예약 모드 */
.book-wrap{max-width:640px;margin:0 auto;padding:20px 14px}
.book-hd{text-align:center;margin-bottom:16px}
.book-hd h1{font-size:20px;font-weight:800}
.book-hd h1 span{color:var(--brand)}
.slot-day{margin-bottom:10px}
.slot-day .d{font-weight:800;font-size:13px;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff;width:64px;text-align:center;font-family:inherit}
.slot.open:hover{border-color:var(--brand);color:var(--brand)}
.slot.mine{background:var(--brand);border-color:var(--brand);color:#fff}
.slot.taken{background:#f0f2f6;color:#b6bdcc;cursor:not-allowed;text-decoration:line-through}
.slot.closed{background:#fbfbfd;color:#ccd2df;cursor:not-allowed}
.slot.blockedS{background:repeating-linear-gradient(45deg,#f0f2f6,#f0f2f6 5px,#e6e9f0 5px,#e6e9f0 10px);color:#b6bdcc;cursor:not-allowed}

    let m=cands.length===1?cands[0]:cands.find(x=>x.packages&&x.packages[0]&&+x.packages[0].count===sm.baseTotal);
    if(!m){
      m={id:'n3_'+i,name:sm.name,trainer:sm.trainer,program:sm.program,status:'active',phone:'',referredBy:sm.ref||'',pref:sm.pref||'',goal:sm.goal||'',notes:'2026-07 퍼피짐 스케줄표 이관(이미지 판독)',carryUsed:sm.carry,followUp:{status:'대기',memo:''},updatedAt:SEED_TS,
        packages:[{id:'n3p_'+i,date:'',count:sm.baseTotal,perPrice:sm.per,amount:sm.baseTotal*sm.per,memo:'이관'}]};
      DB.members.push(m);
    }else{
      m.carryUsed=sm.carry;
      m.trainer=sm.trainer; /* 시트 컬럼 기준 담당 확정 */
      m.name=sm.name;
      if(!m.pref&&sm.pref)m.pref=sm.pref;
      if(!m.goal&&sm.goal)m.goal=sm.goal;
      m.updatedAt=SEED_TS;
    }
    const tot=totalOf(m);
    if(tot<sm.total){
      if(sm.renew&&sm.total-tot===sm.renew.count)
        m.packages.push({id:'n3r_'+i,date:sm.renew.date,count:sm.renew.count,perPrice:sm.renew.per,amount:sm.renew.amount,memo:'재등록(시트 확인)'});
      else
        m.packages.push({id:'n3b_'+i,date:'',count:sm.total-tot,perPrice:perOf(m)||sm.per,amount:0,memo:'이관 보정'});
      m.updatedAt=Math.max(m.updatedAt||0,SEED_TS);
    }
    sm._mid=m.id;
  });
  const td=today();
  REAL_SEED3.sessions.forEach((ss,i)=>{
    const sm=REAL_SEED3.members.find(x=>x.name===ss.name);
    if(!sm||!sm._mid)return;
    DB.sessions.push({id:'s3_'+i,memberId:sm._mid,trainer:ss.trainer,date:ss.date,hour:ss.hour,status:ss.date<=td?'done':'booked',updatedAt:SEED_TS});
  });
  /* 예전 시드가 만든 유령 중복 회원 정리: 시트에 있는 이름과 겹치지만 매칭 안 됐고,
     세션·실결제가 전혀 없는 이관 전용 레코드만 제거 */
  const seedBases=new Set(REAL_SEED3.members.map(x=>baseName(x.name)));
  const matched=new Set(REAL_SEED3.members.map(x=>x._mid));
  DB.members=DB.members.filter(mm=>{
    if(matched.has(mm.id))return true;
    if(!seedBases.has(baseName(mm.name)))return true;
    const userPkg=(mm.packages||[]).some(p=>p.date);
    const hasSess=DB.sessions.some(s=>s.memberId===mm.id);
    if(!userPkg&&!hasSess&&(mm.notes||'').includes('이관')){tomb(mm.id);return false;}
    return true;
  });
  DB.seedVer=3;DB.metaTs=now();
  saveLocal();
  return true;
}
/* 같은 회원·같은 날짜·같은 시간 세션은 1건만 유효 (수업 1회=1시간 원칙).
   기기 간 병합·이중 입력으로 중복이 생겨도 실행/동기화 때마다 자동 정리되고 서버에도 전파된다. */
/* 지난 시간의 예약은 자동으로 완료 처리 — 취소·노쇼만 직원이 직접 변경 */
function autoCompletePast(){
  const nowD=new Date();let n=0;
  DB.sessions.forEach(s=>{
    if(s.status!=='booked')return;
    const end=new Date(s.date+'T'+String(s.hour).padStart(2,'0')+':00:00');
    end.setHours(end.getHours()+1);
    if(nowD>end){s.status='done';s.autoDone=true;s.updatedAt=now();n++;}
  });
  if(n){saveLocal();schedulePush();}
  return n;
}
/* 같은 이름·같은 총횟수 회원이 여러 개면, 세션·실결제가 없는 '초기 데이터 사본'을 제거 */
function dedupeMembers(){
  const byKey={};
  DB.members.forEach(m=>{
    const k=m.name+'|'+((m.packages||[]).reduce((a,p)=>a+(+p.count||0),0));
    (byKey[k]=byKey[k]||[]).push(m);
  });
  let n=0;
  Object.values(byKey).forEach(list=>{
    if(list.length<2)return;
    const score=m=>DB.sessions.filter(s=>s.memberId===m.id).length*100+((m.packages||[]).filter(p=>p.date).length*10)+((m.phone||m.goal||m.pref)?1:0);
    list.sort((a,b)=>score(b)-score(a));
    const keep=list[0];
    list.slice(1).forEach(dup=>{
      const ses=DB.sessions.filter(s=>s.memberId===dup.id);
      if(ses.length===0&&!(dup.packages||[]).some(p=>p.date)){ /* 완전한 사본만 제거 */
        DB.members=DB.members.filter(x=>x.id!==dup.id);tomb(dup.id);n++;
      }
    });
  });
  if(n)saveLocal();
  return n;
}
function dedupeSessions(){
  /* 담당 코치 없이 저장된 세션 복구 (예: 예전 개인 링크 예약 버그) */
  let fixed=0;
  DB.sessions.forEach(s=>{
    if(!s.trainer){const m=DB.members.find(x=>x.id===s.memberId);if(m&&m.trainer){s.trainer=m.trainer;s.updatedAt=now();fixed++;}}
  });
  if(fixed)saveLocal();
  let ghost=0; /* 7월 시트에 없는 6/29~30 유령 세션은 언제 발견돼도 즉시 제거 */
  DB.sessions=DB.sessions.filter(s=>{
    if(s.date>='2026-06-28'&&s.date<='2026-06-30'){tomb(s.id);ghost++;return false;}
    return true;
  });
  const rank={done:4,noshow:3,late_cancel:2,booked:1,cancelled:0};
  const seen={};const del=new Set();
  DB.sessions.slice().sort((a,b)=>(rank[b.status]||0)-(rank[a.status]||0)||(a.updatedAt||0)-(b.updatedAt||0)).forEach(s=>{
    const k=s.memberId+'|'+s.date+'|'+s.hour;
    if(seen[k])del.add(s.id);else seen[k]=true;
  });
  if(del.size||ghost){
    DB.sessions=DB.sessions.filter(s=>!del.has(s.id));
    del.forEach(id=>tomb(id));
    saveLocal();
  }
  let extra=0;
  const dedupeCol=(key,fn)=>{
    const s2={};const d2=[];
    (DB[key]||[]).slice().sort((a,b)=>(a.updatedAt||0)-(b.updatedAt||0)).forEach(x=>{
      const k=fn(x);if(s2[k])d2.push(x.id);else s2[k]=true;
    });
    if(d2.length){DB[key]=DB[key].filter(x=>!d2.includes(x.id));d2.forEach(id=>tomb(id));extra+=d2.length;}
  };
  dedupeCol('gx',g=>g.trainer+'|'+g.date+'|'+g.hour);
  dedupeCol('consults',c=>c.trainer+'|'+c.date+'|'+c.hour+'|'+(c.name||''));
  dedupeCol('personal',p=>p.trainer+'|'+p.date+'|'+p.hour+'|'+(p.text||''));
  if(extra)saveLocal();
  return del.size+ghost+fixed+extra+dedupeMembers();
}
/* 로컬 저장 형식: {data, version, dirty}

  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.members)return {data:d,version:0,dirty:!!localStorage.getItem('fp_dirty')};}catch(e){} /* 예전 형식 호환 */

/* ---- 실행 취소 (↩️ / Ctrl+Z): 이 기기에서의 최근 작업 30단계 ---- */
let UNDO=[],PREV=null;
const SNAP_COLS=['members','sessions','gx','gxPay','refunds','gxMembers','notes','consults','personal','blocks'];
/* ===== 영구 삭제(purge) — 어떤 기기가 되살려도 매번 자동으로 다시 제거 ===== */
function purgeIds(){return new Set((DB.purged||[]).map(p=>p.id));}
/* 모든 삭제는 영구 목록(purged)에 기록 — 만료되지 않아 어떤 병합에서도 부활하지 않음 */
function tomb(id){if(!id)return;markPurged(id);(DB.deleted=DB.deleted||[]).push({id,ts:now()});}
function markPurged(ids){
  const set=purgeIds();
  (Array.isArray(ids)?ids:[ids]).forEach(id=>{if(id&&!set.has(id))DB.purged.push({id,ts:now()});});
  if(DB.purged.length>20000)DB.purged=DB.purged.slice(-20000);
  setTimeout(()=>{try{syncVault();}catch(e){}},50); /* 보호 저장소에 즉시 반영 */
}
function applyPurge(){
  const set=purgeIds();if(!set.size)return 0;
  let n=0;
  SNAP_COLS.forEach(k=>{
    const before=(DB[k]||[]).length;
    DB[k]=(DB[k]||[]).filter(x=>!set.has(x.id));
    n+=before-DB[k].length;
  });
  if(n)saveLocal();
  return n;
}
function snapState(){
  const o={};
  SNAP_COLS.forEach(k=>o[k]=DB[k]||[]);
  o.trainers=DB.trainers;o.trainerMeta=DB.trainerMeta;o.duty=DB.duty;o.noshowDeduct=DB.noshowDeduct;
  return JSON.parse(JSON.stringify(o));
}
function save(){
  DB.appVer=Math.max(DB.appVer||0,APP_VER);
  SYNC.dirty=true;
  if(PREV){UNDO.push(PREV);if(UNDO.length>30)UNDO.shift();}
  PREV=snapState();

  const b=document.getElementById('undo-badge');if(b)b.textContent=UNDO.length;

function applyUndo(){
  if(!UNDO.length){alert('되돌릴 작업이 없습니다. (이 기기에서 한 작업만 취소할 수 있어요)');return;}
  if(!confirm('마지막 작업을 취소하고 이전 상태로 되돌릴까요?'))return;
  const snap=UNDO.pop();
  /* 되돌릴 대상은 영구삭제 목록에서 제외 (id 변경 후에도 반영되도록 먼저 처리) */
  const snapIds=new Set();SNAP_COLS.forEach(k=>(snap[k]||[]).forEach(x=>snapIds.add(x.id)));
  DB.purged=(DB.purged||[]).filter(p=>!snapIds.has(p.id));
  DB.deleted=(DB.deleted||[]).filter(d=>!snapIds.has(d.id));
  const tomb=new Set();
  const idmap={};
  SNAP_COLS.forEach(k=>{
    const cur=DB[k]||[];const old=snap[k]||[];
    const oldIds=new Set(old.map(x=>x.id));
    cur.forEach(x=>{if(!oldIds.has(x.id))tomb(x.id);}); /* 그 후 생긴 것 삭제 */
    DB[k]=old.map(x=>{
      const y={...x,updatedAt:now()};                       /* 복원본이 병합에서 이기도록 */
      if(tomb.has(y.id)){const nid='u_'+uid();idmap[y.id]=nid;y.id=nid;} /* 삭제됐던 건 새 ID로 부활 */
      return y;
    });
  });
  if(Object.keys(idmap).length)DB.sessions.forEach(s=>{if(idmap[s.memberId])s.memberId=idmap[s.memberId];});
  DB.trainers=snap.trainers;DB.trainerMeta=snap.trainerMeta;DB.duty=snap.duty;DB.noshowDeduct=snap.noshowDeduct;DB.metaTs=now();
  PREV=snapState();
  saveLocal();schedulePush();
  addEvent('staff','↩️ 실행 취소');
  closeModal();render();
}

/* ===== 핵심 규칙: 횟수는 수기 입력 금지 — 기록에서 자동 계산 ===== */
function countable(s){return s.status==='done'||(DB.noshowDeduct&&s.status==='noshow');}
function memberSessions(mid){return DB.sessions.filter(s=>s.memberId===mid);}
function usedOf(m){return (m.carryUsed||0)+memberSessions(m.id).filter(countable).length;}
function totalOf(m){return (m.packages||[]).reduce((a,p)=>a+(+p.count||0),0);}
function perOf(m){const p=(m.packages||[]).slice(-1)[0];return p?(+p.perPrice||0):0;}
/* 해당 회차(o)가 속한 결제(패키지)의 회당 단가 — 재등록 할인 시 그 회차부터 새 단가 적용 */
function perForOrdinal(m,o){
  let acc=0;
  for(const p of (m.packages||[])){acc+=(+p.count||0);if(o<=acc)return +p.perPrice||0;}
  return perOf(m);
}
function remainOf(m){return totalOf(m)-usedOf(m);}
function ordinalMap(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return {};
  const list=memberSessions(mid).filter(s=>countable(s)||s.status==='booked')
    .sort((a,b)=>(a.date+String(a.hour).padStart(2,'0')).localeCompare(b.date+String(b.hour).padStart(2,'0')));
  const map={};let n=m.carryUsed||0;
  list.forEach(s=>{n++;map[s.id]=n;});
  return map;
}

/* 코치 색상·이니셜: 동명 성씨 자동 구분 (김택연→김택, 김강윤→김강). 신규 코치 추가 시 자동 배정 */

/* ================= 동기화 (Supabase) ================= */
let SYNC={state:'local',lastPull:0,syncedVer:null,pushTimer:null,pulling:false,dirty:false,pushing:false,lastPush:0,fail:0};
/* 서버 우선 원칙:
   - 로컬은 '빠른 표시용 캐시'일 뿐, 서버 데이터가 항상 정답이다.
   - 단, 아직 서버에 못 올린 내 변경(미전송분)만 예외로 서버 위에 다시 얹는다. */
let SYNCED=null; /* 마지막으로 서버와 일치했던 상태 */
function markSynced(){SYNCED=snapState();SYNCED.purged=(DB.purged||[]).slice();SYNCED.metaTs=DB.metaTs||0;SYNC.dirty=false;saveLocal();}
function pendingDelta(){
  const out=fresh();
  const base=SYNCED||fresh();
  SNAP_COLS.forEach(k=>{
    const m={};(base[k]||[]).forEach(x=>m[x.id]=(x.updatedAt||0));
    out[k]=(DB[k]||[]).filter(x=>!(x.id in m)||(x.updatedAt||0)!==m[x.id]);
  });
  const bp=new Set((base.purged||[]).map(p=>p.id));
  out.purged=(DB.purged||[]).filter(p=>!bp.has(p.id));
  out.metaTs=DB.metaTs||0;out.trainers=DB.trainers;out.trainerMeta=DB.trainerMeta;out.duty=DB.duty;out.noshowDeduct=DB.noshowDeduct;
  out.seq=DB.seq;out.appVer=DB.appVer;out.seedVer=DB.seedVer;
  return out;
}
/* 서버 데이터로 로컬을 완전히 대체 (서버가 정답) */
function emptyBase(){const b=fresh();b.metaTs=0;return b;} /* metaTs=0 → 서버의 코치·당직·설정이 항상 우선 */
function adoptServerHard(remote){
  DB=mergeDB(emptyBase(),remote);
  if(remote.trainers)DB.trainers=remote.trainers.slice();
  if(remote.trainerMeta)DB.trainerMeta=JSON.parse(JSON.stringify(remote.trainerMeta));
  if(remote.duty)DB.duty=JSON.parse(JSON.stringify(remote.duty));
  if(typeof remote.noshowDeduct==='boolean')DB.noshowDeduct=remote.noshowDeduct;
  DB.metaTs=remote.metaTs||0;
  ensureMeetingBlocks();applyPurge();dedupeSessions();autoCompletePast();

  <h3>GX 결제 추가 <span style="font-size:12px;color:var(--sub);font-weight:500">— 부가세 뺀 금액으로 입력</span></h3>
  <div class="frm">
    <div><label>회원 이름 *</label><input id="gp-name"></div>
    <div><label>결제일</label><input type="date" id="gp-date" value="${today()}"></div>
    <div><label>등록 개월 수 *</label><select id="gp-months"><option value="1">1개월</option><option value="3">3개월</option><option value="5">5개월</option><option value="8">8개월</option><option value="12">12개월</option></select></div>
    <div><label>결제 금액 (부가세 제외) *</label><input type="number" id="gp-amount" placeholder="예: 500000"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button>
  <button class="btn" onclick="(function(){const n=document.getElementById('gp-name').value.trim(),c=+document.getElementById('gp-months').value||0,a=+document.getElementById('gp-amount').value||0;
    if(!n||!c||!a){alert('이름·개월·금액을 입력해 주세요.');return;}
    DB.gxPay.push({id:uid(),name:n,date:document.getElementById('gp-date').value,months:c,amount:a,updatedAt:now()});
    addEvent('staff','GX 결제: '+n+' '+c+'개월 '+fmtW(a));save();closeModal();render();})()">저장</button></div>`);
}
function delGxPay(id){if(!confirm('이 GX 결제 기록을 삭제할까요?'))return;tomb(id);DB.gxPay=DB.gxPay.filter(x=>x.id!==id);save();render();}
function openRefundAdd(){
  openModal(`
  <h3>환불 기록 추가 <span style="font-size:12px;color:var(--sub);font-weight:500">— 부가세 뺀 금액</span></h3>
  <div class="frm">
    <div><label>구분</label><select id="rf-type"><option>PT</option><option>GX</option></select></div>
    <div><label>회원 이름 *</label><input id="rf-name"></div>
    <div><label>환불일</label><input type="date" id="rf-date" value="${today()}"></div>
    <div><label>환불 금액 (부가세 제외) *</label><input type="number" id="rf-amount" placeholder="예: 300000"></div>
    <div class="full"><label>사유·메모</label><input id="rf-memo" placeholder="예: 이사로 잔여 10회 환불"></div>
  </div>
  <div class="note" style="margin-top:8px">PT 환불 시 잔여 횟수 조정은 [회원 관리 → 회원 카드 → 결제 수정]에서 횟수를 줄여주세요.</div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button>
  <button class="btn" onclick="(function(){const n=document.getElementById('rf-name').value.trim(),a=+document.getElementById('rf-amount').value||0;
    if(!n||!a){alert('이름과 금액을 입력해 주세요.');return;}
    DB.refunds.push({id:uid(),type:document.getElementById('rf-type').value,name:n,date:document.getElementById('rf-date').value,amount:a,memo:document.getElementById('rf-memo').value.trim(),updatedAt:now()});
    addEvent('staff','환불: '+n+' '+fmtW(a));save();closeModal();render();})()">저장</button></div>`);
}
function delRefund(id){if(!confirm('이 환불 기록을 삭제할까요?'))return;tomb(id);DB.refunds=DB.refunds.filter(x=>x.id!==id);save();render();}
function goldenList(){return DB.members.filter(m=>m.status==='active'&&totalOf(m)>0&&remainOf(m)<=3&&remainOf(m)>0);}
function expiredList(){return DB.members.filter(m=>m.status==='active'&&totalOf(m)>0&&remainOf(m)<=0);}
function lateCancelList(){return DB.sessions.filter(s=>s.status==='late_cancel');}
function viewDash(){
  const mk=DASH_MONTH,st=monthStats(mk);
  const active=DB.members.filter(m=>m.status==='active').length;
  const golden=goldenList().length,expired=expiredList().length;
  const lc=lateCancelList();
  let months=[];{let d=new Date(mk+'-01T00:00:00');for(let i=5;i>=0;i--){const t=new Date(d);t.setMonth(t.getMonth()-i);months.push(ymd(t).slice(0,7));}}
  const payArr=months.map(k=>monthStats(k).pay);
  const doneArr=months.map(k=>monthStats(k).done);
  const maxPay=Math.max(...payArr,1),maxDone=Math.max(...doneArr,1);
  const omCache={};
  /* 퇴사한 코치도 그 달에 수업·GX 기록이 있으면 성과 표에 포함 (정산 보존) */
  const actSet=new Set();
  DB.sessions.forEach(s=>{if(monthKey(s.date)===mk&&s.trainer)actSet.add(s.trainer);});
  (DB.gx||[]).forEach(g=>{if(monthKey(g.date)===mk&&g.trainer)actSet.add(g.trainer);});
  const rowTrainers=[...DB.trainers,...[...actSet].filter(t=>!DB.trainers.includes(t))];
  const tRows=rowTrainers.map(t=>{
    const mems=DB.members.filter(m=>m.status==='active'&&m.trainer===t);
    const doneS=DB.sessions.filter(s=>s.trainer===t&&s.status==='done'&&monthKey(s.date)===mk).length;
    /* 정산: 완료 + 노쇼(차감된 것) 포함 — 회원에게 차감됐으니 수업료 발생 */
    const payList=DB.sessions.filter(s=>s.trainer===t&&monthKey(s.date)===mk&&(s.status==='done'||(s.status==='noshow'&&DB.noshowDeduct)));
    let settle=0;payList.forEach(s=>{const m=DB.members.find(x=>x.id===s.memberId);if(!m)return;
      if(!omCache[m.id])omCache[m.id]=ordinalMap(m.id);
      const o=omCache[m.id][s.id];
      settle+=o?perForOrdinal(m,o):perOf(m);});
    const ns=DB.sessions.filter(s=>s.trainer===t&&s.status==='noshow'&&monthKey(s.date)===mk).length;
    let pay=0;mems.forEach(m=>(m.packages||[]).forEach(p=>{if(monthKey(p.date)===mk)pay+=(+p.amount||0);}));
    const gxN=(DB.gx||[]).filter(g=>g.trainer===t&&monthKey(g.date)===mk&&g.date<=today()).length;
    const gxPay=gxN*gxRate(mk);
    const gold=mems.filter(m=>totalOf(m)>0&&remainOf(m)<=3).length;
    return {t,mem:mems.length,doneS,ns,pay,gold,settle,gxN,gxPay,former:!DB.trainers.includes(t)};
  });
  return `
  <div class="toolbar">
    <label style="font-weight:700;font-size:13px">기준 월</label>
    <input type="month" value="${mk}" onchange="DASH_MONTH=this.value;render()">
    <span class="sp"></span>
    <span style="font-size:12px;color:var(--sub)">모든 수치는 세션·결제 기록에서 자동 집계 (수기 입력 없음)</span>
  </div>
  ${lc.length?`<div class="card" style="border-color:#f3c98b;background:#fffaf1"><h2>⚠️ 차감 판단 대기 <span class="hint">수업 12시간 이내 취소 — 코치 재량으로 결정</span></h2>
    <table><tbody>${lc.map(s=>{const m=DB.members.find(x=>x.id===s.memberId);return `<tr><td><b>${esc(m?m.name:'?')}</b></td><td>${korDate(s.date)} ${s.hour}:00</td><td>${esc(s.trainer)}</td>
    <td style="text-align:right"><button class="btn small danger" onclick="decideLate('${s.id}','noshow')">차감 확정</button> <button class="btn small ghost" onclick="decideLate('${s.id}','cancelled')">차감 없이 취소</button></td></tr>`;}).join('')}</tbody></table></div>`:''}
  <div class="grid-kpi">
    <div class="kpi"><div class="k-label">활성 회원</div><div class="k-val">${active}명</div><div class="k-sub">신규 등록 ${st.newMembers}명 (${mk.slice(5)}월)</div></div>
    <div class="kpi"><div class="k-label">이번 달 완료 세션</div><div class="k-val">${st.done}회</div><div class="k-sub">노쇼 ${st.noshow} · 취소 ${st.cancel}</div></div>
    <div class="kpi"><div class="k-label">이번 달 PT 결제액</div><div class="k-val">${fmtW(st.pay)}</div><div class="k-sub">신규+재등록 (이관분 제외)</div></div>
    <div class="kpi"><div class="k-label">이번 달 GX 매출</div><div class="k-val">${fmtW(gxMonthRev(mk))}</div><div class="k-sub">부가세 제외 · 결제 ${(DB.gxPay||[]).filter(p=>monthKey(p.date)===mk).length}건</div></div>
    <div class="kpi"><div class="k-label">이번 달 환불</div><div class="k-val" style="color:var(--bad)">${fmtW(refundMonth(mk).reduce((a,r)=>a+(+r.amount||0),0))}</div><div class="k-sub">PT ${refundMonth(mk).filter(r=>r.type==='PT').length} · GX ${refundMonth(mk).filter(r=>r.type==='GX').length}건</div></div>
    <div class="kpi"><div class="k-label">이번 달 재등록</div><div class="k-val">${st.renewPkg}건</div><div class="k-sub">추가 패키지 결제 기준</div></div>
    <div class="kpi ${golden+expired>0?'alert':''}"><div class="k-label">재등록 골든타임 🔔</div><div class="k-val">${golden+expired}명</div><div class="k-sub">잔여 3회 이하 ${golden} · 만료 ${expired}</div></div>
    <div class="kpi"><div class="k-label">노쇼율</div><div class="k-val">${st.noshowRate}%</div><div class="k-sub">노쇼 ÷ (완료+노쇼)</div></div>
  </div>
  <div class="two-col">
    <div class="card"><h2>월별 결제액 <span class="hint">최근 6개월</span></h2>
      <div class="bars">${months.map((k,i)=>`<div class="bar-col"><div class="bv">${payArr[i]?Math.round(payArr[i]/10000)+'만':''}</div><div class="bar" style="height:${Math.round(payArr[i]/maxPay*100)}%"></div><div class="bl">${k.slice(5)}월</div></div>`).join('')}</div>
    </div>
    <div class="card"><h2>월별 완료 세션 <span class="hint">최근 6개월</span></h2>
      <div class="bars">${months.map((k,i)=>`<div class="bar-col"><div class="bv">${doneArr[i]||''}</div><div class="bar" style="height:${Math.round(doneArr[i]/maxDone*100)}%;background:linear-gradient(180deg,#3ecf8e,#0eab6b)"></div><div class="bl">${k.slice(5)}월</div></div>`).join('')}</div>
    </div>
  </div>
  <div class="card"><h2>트레이너별 성과 <span class="hint">${mk} · 주간/월간 리뷰 자료</span></h2>
    <table><thead><tr><th>트레이너</th><th>담당 활성 회원</th><th>완료 세션</th><th>💰 수업료 정산</th><th>GX 횟수</th><th>GX 정산</th><th>노쇼</th><th>담당 결제액</th><th>재등록 임박</th></tr></thead>
    <tbody>${tRows.map(r=>`<tr><td><b style="color:${tMeta(r.t).color}">${esc(r.t)}</b>${r.former?' <span class="badge b-gray">퇴사</span>':''}</td><td class="mono">${r.mem}명</td><td class="mono">${r.doneS}회</td><td class="mono" style="font-weight:800">${fmtW(r.settle)}</td><td class="mono">${r.gxN}회</td><td class="mono">${r.gxPay?fmtW(r.gxPay):'-'}</td><td class="mono">${r.ns}</td><td class="mono">${fmtW(r.pay)}</td><td>${r.gold?`<span class="badge b-warn">${r.gold}명</span>`:'-'}</td></tr>`).join('')}
    <tr style="background:#f8fafd"><td><b>합계</b></td><td class="mono">${tRows.reduce((a,r)=>a+r.mem,0)}명</td><td class="mono">${tRows.reduce((a,r)=>a+r.doneS,0)}회</td><td class="mono" style="font-weight:800">${fmtW(tRows.reduce((a,r)=>a+r.settle,0))}</td><td class="mono">${tRows.reduce((a,r)=>a+r.gxN,0)}회</td><td class="mono">${fmtW(tRows.reduce((a,r)=>a+r.gxPay,0))}</td><td class="mono">${tRows.reduce((a,r)=>a+r.ns,0)}</td><td class="mono">${fmtW(tRows.reduce((a,r)=>a+r.pay,0))}</td><td></td></tr></tbody></table>
    <div class="note" style="margin-top:10px">💰 수업료 정산 = 그 달 완료 세션마다 <b>그 회차가 속한 결제의 회당 가격</b>을 합산 (회당 가격 = 결제액÷횟수의 50%). 재등록 시 단가가 바뀌면 <b>재등록 시작 회차부터 새 단가</b>가 자동 적용됩니다. <b>노쇼(차감)는 정산에 포함</b>되고, 차감 없는 취소는 미포함. GX 정산 = 그 코치의 진행 횟수 × 회당 단가. 회당 단가 = (그 달 GX 결제액[부가세 제외] × 50%, 나머지 50%는 센터 관리비) ÷ 그 달 전체 진행 횟수 — ${mk} 단가 <b>${fmtW(gxRate(mk))}/회</b>. 코치 정산 합계는 항상 그 달 GX 결제액의 50%와 일치합니다.</div>
  </div>
  <div class="two-col">
  <div class="card"><h2>이번 달 신규 PT 등록 <span class="hint">${mk} · 코치별 명단</span></h2>
    <table><tbody>${DB.trainers.map(t=>{
      const list=DB.members.filter(m=>m.trainer===t&&m.packages&&m.packages[0]&&monthKey(m.packages[0].date)===mk);
      return `<tr><td style="width:90px"><b style="color:${tMeta(t).color}">${esc(t)}</b></td><td class="mono" style="width:56px;font-weight:800">${list.length}명</td><td>${list.map(m=>`<span class="badge b-blue" style="cursor:pointer;margin:2px" onclick="openMember('${m.id}')">${esc(m.name)}</span>`).join(' ')||'<span style="color:var(--sub);font-size:12px">-</span>'}</td></tr>`;
    }).join('')}
    <tr style="background:#f8fafd"><td><b>합계</b></td><td class="mono" style="font-weight:800">${DB.members.filter(m=>m.packages&&m.packages[0]&&monthKey(m.packages[0].date)===mk).length}명</td><td></td></tr></tbody></table>
  </div>
  <div class="card"><h2>PT 결제 원장 <span class="hint">실제 결제 내역 (이관분 제외)</span></h2>
    ${(function(){
      const pays=[];
      DB.members.forEach(m=>(m.packages||[]).forEach((p,i)=>{if(p.date)pays.push({date:p.date,name:m.name,mid:m.id,count:p.count,amount:+p.amount||0,re:i>0});}));
      pays.sort((a,b)=>b.date.localeCompare(a.date));
      const monthSum=pays.filter(p=>monthKey(p.date)===mk).reduce((a,p)=>a+p.amount,0);
      const monthN=pays.filter(p=>monthKey(p.date)===mk).length;
      return `<div class="note" style="margin-bottom:8px">${mk} 합계: <b>${fmtW(monthSum)}</b> · ${monthN}건</div>`+
      (pays.length?`<table><thead><tr><th>결제일</th><th>이름</th><th>횟수</th><th>금액</th><th></th></tr></thead><tbody>
      ${pays.slice(0,10).map(p=>`<tr class="clickable" onclick="openMember('${p.mid}')"><td>${p.date}</td><td><b>${esc(p.name)}</b></td><td class="mono">${p.count}회</td><td class="mono">${fmtW(p.amount)}</td><td>${p.re?'<span class="badge b-ok">재</span>':'<span class="badge b-blue">초</span>'}</td></tr>`).join('')}</tbody></table>
      ${pays.length>10?`<div style="font-size:12px;color:var(--sub);margin-top:6px">외 ${pays.length-10}건 — 각 회원 카드에서 확인</div>`:''}`:'<div class="empty">결제 기록 없음</div>');
    })()}
  </div>
  </div>
  <div class="two-col">
    <div class="card"><h2>GX 결제 원장 <span class="hint">누가 · 언제 · 몇 회 · 얼마(부가세 제외)</span>
      <button class="btn small" style="margin-left:auto" onclick="openGxPayAdd()">+ GX 결제</button></h2>
      ${(DB.gxPay||[]).length?`<table><thead><tr><th>결제일</th><th>이름</th><th>개월</th><th>금액</th><th></th></tr></thead><tbody>
      ${DB.gxPay.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10).map(p=>`<tr><td>${p.date||'-'}</td><td><b>${esc(p.name)}</b></td><td class="mono">${p.months||p.count||'-'}개월</td><td class="mono">${fmtW(p.amount)}</td><td style="text-align:right"><button class="btn small ghost" style="color:var(--bad)" onclick="delGxPay('${p.id}')">삭제</button></td></tr>`).join('')}</tbody></table>
      ${DB.gxPay.length>10?`<div style="font-size:12px;color:var(--sub);margin-top:6px">외 ${DB.gxPay.length-10}건 (누적 ${DB.gxPay.length}건 · 총 ${fmtW(DB.gxPay.reduce((a,p)=>a+(+p.amount||0),0))})</div>`:''}`:'<div class="empty">GX 결제 기록이 없습니다. [+ GX 결제]로 추가하세요.</div>'}
    </div>
    <div class="card"><h2>환불 기록 <span class="hint">PT · GX</span>
      <button class="btn small danger" style="margin-left:auto" onclick="openRefundAdd()">+ 환불</button></h2>
      ${(DB.refunds||[]).length?`<table><thead><tr><th>환불일</th><th>구분</th><th>이름</th><th>금액</th><th>메모</th><th></th></tr></thead><tbody>
      ${DB.refunds.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,10).map(r=>`<tr><td>${r.date||'-'}</td><td><span class="badge ${r.type==='GX'?'b-blue':'b-vio'}">${r.type}</span></td><td><b>${esc(r.name)}</b></td><td class="mono" style="color:var(--bad)">-${fmtW(r.amount)}</td><td style="font-size:12px;color:var(--sub)">${esc(r.memo||'')}</td><td style="text-align:right"><button class="btn small ghost" onclick="delRefund('${r.id}')">삭제</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">환불 기록 없음</div>'}
    </div>
  </div>`;
}
function decideLate(sid,st){
  const s=DB.sessions.find(x=>x.id===sid);if(!s)return;
  const m=DB.members.find(x=>x.id===s.memberId);
  s.status=st;s.updatedAt=now();
  addEvent('staff',`${m?m.name:'?'}님 ${korDate(s.date)} ${s.hour}시 늦은 취소 → ${st==='noshow'?'차감 확정':'차감 없이 취소'}`);
  save();render();
}

/* ================= 스케줄 ================= */
function chipHTML(s,om,compact){
  if(s.hidden)return '';
  const m=DB.members.find(x=>x.id===s.memberId);if(!m)return '';
  const tot=totalOf(m);const o=om[s.id];
  const over=o>tot&&tot>0;
  const stTxt={booked:'',done:'✓ ',noshow:'✗ ',cancelled:'',late_cancel:'⚠ '}[s.status]||'';
  const cnt=(s.status==='cancelled')?'취소':(s.status==='late_cancel')?'차감대기':`<span class="cnt">${o||'-'}/${tot}</span>`;
  const tm=tMeta(s.trainer);
  const tI=compact?`<span class="tt" style="color:${tm.color}">${esc(tm.initial)}</span>·`:'';
  const drag=['booked','done'].includes(s.status)?`draggable="true" ondragstart="dragSes(event,'${s.id}')"`:'';
  return `<div class="chip ${s.status} ${over?'over':''}" style="border-left:3px solid ${tm.color}" ${drag} title="${esc(s.memo||'')}" onclick="event.stopPropagation();openSessionMenu('${s.id}')">${stTxt}${tI}${esc(m.name)} ${cnt}${s.memo?`<span style="opacity:.75;font-weight:500"> ✎${esc(s.memo.slice(0,8))}</span>`:''}</div>`;
}
function consultChips(date,hour,tf){
  return (DB.consults||[]).filter(c=>c.date===date&&c.hour===hour&&(!tf||c.trainer===tf)).map(c=>{
    const tm=tMeta(c.trainer);
    return `<div class="chip consult" style="border-left:3px solid ${tm.color}" title="${esc(c.memo||'')}" onclick="event.stopPropagation();openConsultMenu('${c.id}')">상담·${c.kind} ${esc(c.name||'')}</div>`;
  }).join('');
}
function openConsultMenu(id){
  const c=DB.consults.find(x=>x.id===id);if(!c)return;
  openModal(`

function copyPrevWeek(){
  const prev=[...Array(7)].map((_,i)=>addDays(SCHED.week,i-7));
  const cur=[...Array(7)].map((_,i)=>addDays(SCHED.week,i));
  let added=0,skipped=0;
  prev.forEach((pd,i)=>{
    DB.sessions.filter(s=>s.date===pd&&!['cancelled','late_cancel'].includes(s.status)).forEach(s=>{
      const m=DB.members.find(x=>x.id===s.memberId);
      if(!m||m.status!=='active'){skipped++;return;}
      if(DB.sessions.find(x=>x.date===cur[i]&&x.hour===s.hour&&x.memberId===s.memberId&&['booked','done','noshow'].includes(x.status))){skipped++;return;}
      const booked=memberSessions(m.id).filter(x=>x.status==='booked').length;
      if(remainOf(m)-booked<=0){skipped++;return;}
      DB.sessions.push({id:uid(),memberId:s.memberId,trainer:s.trainer,date:cur[i],hour:s.hour,status:'booked',updatedAt:now()});
      added++;
    });
  });
  save();render();
  alert(`지난주 세션 ${added}건을 예약으로 복사했습니다.`+(skipped?`\n(중복·잔여 부족·비활성 ${skipped}건 제외 — 회차는 자동 재계산되므로 안전)`:''));
}

function setAddMode(m2){
  ['pt','gx','cs','ps','bl'].forEach(k=>{
    document.getElementById('pane-'+k).style.display=k===m2?'':'none';
    document.getElementById('tab-'+k).classList.toggle('on',k===m2);
  });
}
function asSyncWd(){
  const d=document.getElementById('as-date').value;if(!d)return;
  const wd=(new Date(d+'T00:00:00').getDay()+6)%7;
  document.querySelectorAll('.as-wd').forEach(c=>{if(!c.checked&&+c.value===wd){c.checked=true;c.parentNode.classList.add('on');}});
  asPreview();
}
function addGx(){
  const t=document.getElementById('gxa-trainer').value;
  const d0=document.getElementById('gxa-date').value;
  const hh=+document.getElementById('gxa-hour').value;
  const wds=[...document.querySelectorAll('.gxa-wd:checked')].map(c=>+c.value);
  const weeks=+document.getElementById('gxa-weeks').value;
  if(!wds.length){alert('요일을 선택해 주세요.');return;}
  const base=mondayOf(d0);let added=0;
  for(let w2=0;w2<weeks;w2++){
    for(const wd of wds){
      const d=addDays(base,w2*7+wd);
      if(d<d0)continue;
      if(DB.gx.some(g=>g.date===d&&g.hour===hh&&g.trainer===t))continue;
      DB.gx.push({id:uid(),date:d,hour:hh,trainer:t,updatedAt:now()});added++;
    }
  }
  save();closeModal();render();
  if(added>1)alert(added+'건의 GX가 등록되었습니다.');
}
function addConsult(){
  const name=document.getElementById('csa-name').value.trim();
  DB.consults.push({id:uid(),kind:document.getElementById('csa-kind').value,trainer:document.getElementById('csa-trainer').value,
    name,date:document.getElementById('csa-date').value,hour:+document.getElementById('csa-hour').value,
    memo:document.getElementById('csa-memo').value.trim(),updatedAt:now()});
  addEvent('staff','상담 등록: '+name);
  save();closeModal();render();
}
function addPersonal(){
  const text=document.getElementById('psa-text').value.trim();
  if(!text){alert('내용을 입력해 주세요.');return;}
  const t=document.getElementById('psa-trainer').value;
  const d0=document.getElementById('psa-date').value;
  const hh=+document.getElementById('psa-hour').value;
  const rep2=+document.getElementById('psa-repeat').value;
  for(let i=0;i<rep2;i++){
    const d=addDays(d0,i*7);
    if(DB.personal.some(p=>p.date===d&&p.hour===hh&&p.trainer===t&&p.text===text))continue;
    DB.personal.push({id:uid(),trainer:t,date:d,hour:hh,text,updatedAt:now()});
  }
  save();closeModal();render();
}
function addBlockQuick(){
  const t=document.getElementById('bla-trainer').value;
  const d=document.getElementById('bla-date').value;
  const from=+document.getElementById('bla-from').value,to=+document.getElementById('bla-to').value;
  if(!d||to<from){alert('시간 범위를 확인해 주세요.');return;}
  for(let hh=from;hh<=to;hh++){
    if(!DB.blocks.some(b=>b.trainer===t&&b.date===d&&b.hour===hh))
      DB.blocks.push({id:uid(),trainer:t,date:d,hour:hh,updatedAt:now()});
  }
  save();closeModal();render();
}
function asFillMembers(){
  const t=document.getElementById('as-trainer').value;
  const all=document.getElementById('as-all').checked;
  const sel=document.getElementById('as-member');
  const list=DB.members.filter(m=>m.status==='active'&&(all||m.trainer===t)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  sel.innerHTML='<option value="">회원 선택…</option>'+list.map(m=>`<option value="${m.id}">${esc(m.name)}${all?' · '+esc(m.trainer):''} · ${usedOf(m)}/${totalOf(m)} (잔여 ${remainOf(m)})</option>`).join('');
  document.getElementById('as-preview').innerHTML=list.length?'':'<div class="note warn">이 코치의 활성 회원이 없습니다. "다른 코치 회원도 표시"를 체크해 보세요.</div>';
}
function asPreview(){
  const mid=document.getElementById('as-member').value;const box=document.getElementById('as-preview');
  if(!mid){box.innerHTML='';return;}
  const m=DB.members.find(x=>x.id===mid);
  const booked=memberSessions(mid).filter(s=>s.status==='booked').length;
  const rem=remainOf(m)-booked;
  const wds=[...document.querySelectorAll('.as-wd:checked')].length||1;
  const repV=document.getElementById('as-repeat').value;
  const planned=repV==='auto'?Math.max(0,rem):Math.min(wds*(+repV),Math.max(0,rem));
  box.innerHTML=rem<=0
    ?`<div class="note bad">⚠ ${esc(m.name)}님 잔여 횟수 없음 (사용 ${usedOf(m)}/${totalOf(m)}, 예약 대기 ${booked}). 재등록 결제를 먼저 등록해 주세요.</div>`
    :`<div class="note">다음 회차: <b>${usedOf(m)+booked+1} / ${totalOf(m)}</b> · 예약 가능 잔여 ${rem}회 · 이번에 약 <b>${planned}건</b> 생성 ${rem<=3?'<span class="badge b-warn">재등록 골든타임</span>':''}</div>`;
}
function addSession(){
  const mid=document.getElementById('as-member').value;
  if(!mid){alert('회원을 선택해 주세요.');return;}
  const m=DB.members.find(x=>x.id===mid);
  const date=document.getElementById('as-date').value;
  const hour=+document.getElementById('as-hour').value;
  const trainer=document.getElementById('as-trainer').value;
  const repV=document.getElementById('as-repeat').value;
  const wds=[...document.querySelectorAll('.as-wd:checked')].map(c=>+c.value);
  if(!wds.length){alert('요일을 하나 이상 선택해 주세요.');return;}
  const booked=memberSessions(mid).filter(s=>s.status==='booked').length;
  let can=remainOf(m)-booked;
  if(can<=0&&!confirm(`${m.name}님 잔여 횟수가 없습니다. 그래도 예약할까요? (재등록 예정)`))return;
  const auto=repV==='auto';
  const weeks=auto?52:+repV;
  const base=mondayOf(date);
  let added=0,blockedN=0;
  outer:
  for(let w2=0;w2<weeks;w2++){
    for(const wd of wds.sort((a,b)=>a-b)){
      const d=addDays(base,w2*7+wd);
      if(d<date)continue;
      if(DB.sessions.find(x=>x.date===d&&x.hour===hour&&x.memberId===mid&&['booked','done','noshow'].includes(x.status)))continue;
      if((auto||weeks>1||wds.length>1)&&can-added<=0)break outer;
      if(isBlocked(trainer,d,hour)){blockedN++;continue;}
      DB.sessions.push({id:uid(),memberId:mid,trainer,date:d,hour,status:'booked',memo:(document.getElementById('as-memo')||{value:''}).value.trim(),updatedAt:now()});added++;
    }
    if(auto&&can-added<=0)break;
  }
  save();closeModal();render();
  if(added>1||blockedN)alert(`${added}건 예약 완료 (잔여 한도 내 자동 생성${blockedN?', 수업 불가 시간 '+blockedN+'건 건너뜀':''}).`);
}

    <div><label>메모 (구체 시간 등)</label><input id="sm-memo" value="${esc(s.memo||'')}" placeholder="예: 11:30 시작"></div>

  </div>
  <div class="pill-row">
    <button class="btn" onclick="setSession('${sid}','done')">✓ 수업 완료</button>
    <button class="btn danger" onclick="setSession('${sid}','noshow')">✗ 노쇼/차감${DB.noshowDeduct?'':' (차감 OFF)'}</button>
    <button class="btn ghost" onclick="setSession('${sid}','cancelled')">취소 (차감 없음)</button>
    <button class="btn ghost" onclick="setSession('${sid}','booked')">예약으로 되돌리기</button>
    <button class="btn ghost" onclick="delSession('${sid}')">기록 삭제</button>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
}
function delSession(sid){
  if(!confirm('이 세션 기록을 삭제할까요?'))return;
  tomb(sid);
  DB.sessions=DB.sessions.filter(x=>x.id!==sid);
  save();closeModal();render();
}
function setSession(sid,st){
  const s=DB.sessions.find(x=>x.id===sid);s.status=st;s.updatedAt=now();save();closeModal();render();
  const m=DB.members.find(x=>x.id===s.memberId);
  if(m&&(st==='done'||st==='noshow')&&remainOf(m)===3)setTimeout(()=>alert(`🔔 ${m.name}님 잔여 3회 — 재등록 골든타임. [재등록 관리]에 자동 등록되었습니다.`),50);
}

function addTrainer(){
  const v=document.getElementById('new-trainer').value.trim();
  if(!v)return;
  if(DB.trainers.includes(v)){alert('이미 있는 이름입니다.');return;}
  DB.trainers.push(v);tMeta(v);DB.metaTs=now();ensureMeetingBlocks();
  addEvent('staff',v+' 코치가 추가되었습니다');
  save();render();
}
function removeTrainer(i){
  const t=DB.trainers[i];
  const mems=DB.members.filter(m=>m.trainer===t&&m.status!=='ended');
  const futs=DB.sessions.filter(s=>s.trainer===t&&s.status==='booked');
  if(!mems.length&&!futs.length){
    if(confirm(t+' 코치를 목록에서 제거할까요? (과거 수업 기록·통계는 그대로 보존됩니다)')){
      DB.trainers.splice(i,1);
      for(const k in (DB.duty||{})){if(DB.duty[k].am===t)DB.duty[k].am='';if(DB.duty[k].pm===t)DB.duty[k].pm='';}
      DB.blocks=DB.blocks.filter(b=>b.trainer!==t);
      DB.metaTs=now();save();render();
    }
    return;
  }
  openHandover(t);
}
function openHandover(t){
  const others=DB.trainers.filter(x=>x!==t);
  if(!others.length){alert('인수받을 코치가 없습니다. 먼저 새 코치를 추가해 주세요.');return;}
  const mems=DB.members.filter(m=>m.trainer===t&&m.status!=='ended').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  openModal(`
  <h3>${esc(t)} 코치 퇴사 — 회원 인수인계</h3>
  <div class="note" style="margin-bottom:10px">담당 회원 <b>${mems.length}명</b>과 예약된 수업을 새 코치에게 넘깁니다. 과거 수업 기록·통계는 ${esc(t)} 코치 이름으로 보존되며, 각 회원 메모에 인수인계 이력이 자동 기록됩니다.</div>
  <div style="margin-bottom:8px;font-size:13px">일괄 지정:
    <select id="hv-bulk" onchange="document.querySelectorAll('.hv-sel').forEach(s=>s.value=this.value)">${others.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
    <span style="color:var(--sub);font-size:12px">(회원별로 개별 변경 가능)</span></div>
  <div class="hist" style="max-height:280px"><table><tbody>
  ${mems.map(m=>`<tr><td><b>${esc(m.name)}</b> <span class="mono" style="color:var(--sub)">${usedOf(m)}/${totalOf(m)}</span></td>
  <td style="font-size:11.5px;color:var(--sub)">${esc((m.goal||'').slice(0,22))}</td>
  <td><select class="hv-sel" data-mid="${m.id}">${others.map(o=>`<option>${esc(o)}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">취소</button>
  <button class="btn danger" onclick="applyHandover('${esc(t)}')">인수인계 실행 & 퇴사 처리</button></div>`);
}
function applyHandover(t){
  let n=0;
  document.querySelectorAll('.hv-sel').forEach(sel=>{
    const m=DB.members.find(x=>x.id===sel.dataset.mid);if(!m)return;
    const to=sel.value;
    m.trainer=to;m.updatedAt=now();n++;
    m.notes=((m.notes||'')+'\n['+today()+'] '+t+' → '+to+' 인수인계').trim();
    DB.sessions.filter(s=>s.memberId===m.id&&s.status==='booked'&&s.trainer===t).forEach(s=>{s.trainer=to;s.updatedAt=now();});
  });
  const i=DB.trainers.indexOf(t);if(i>=0)DB.trainers.splice(i,1);
  for(const k in (DB.duty||{})){if(DB.duty[k].am===t)DB.duty[k].am='';if(DB.duty[k].pm===t)DB.duty[k].pm='';}
  DB.blocks=DB.blocks.filter(b=>b.trainer!==t);
  DB.metaTs=now();
  addEvent('staff',t+' 코치 퇴사 — 회원 '+n+'명 인수인계 완료');
  save();closeModal();render();
  alert('인수인계 완료. 과거 기록과 통계는 보존됩니다. 당직표를 확인해 주세요.');
}

/* ---- 수업 불가 시간 ---- */
let BLK_TRAINER='';
function openBlocks(){
  BLK_TRAINER=BLK_TRAINER||DB.trainers[0];
  renderBlocks();
}
function renderBlocks(){
  const t=BLK_TRAINER;
  openModal(`
  <h3>🚫 수업 불가 시간 <span style="font-size:12px;color:var(--sub);font-weight:500">— 매주 반복 차단 (회원 예약 불가, 직원은 경고 후 가능)</span></h3>
  <div style="margin-bottom:10px"><select onchange="BLK_TRAINER=this.value;renderBlocks()">${DB.trainers.map(x=>`<option ${x===t?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div style="overflow-x:auto"><table class="block-grid">
    <tr><th style="width:52px">시간</th>${DAYN.map(d=>`<th style="width:44px">${d}</th>`).join('')}</tr>
    ${HOURS.map(h=>`<tr><th>${h}:00</th>${DAYN.map((d,wd)=>{
      const b=DB.blocks.some(x=>x.trainer===t&&x.weekday===wd&&!x.date&&x.hour===h);
      return `<td class="${b?'b':''}" onclick="toggleBlock(${wd},${h})">${b?'✕':''}</td>`;
    }).join('')}</tr>`).join('')}
  </table></div>
  <h4 style="margin:14px 0 6px;font-size:13px">특정 날짜만 차단 <span style="font-weight:500;color:var(--sub);font-size:12px">— 휴가·세미나 등 일회성 (회원 예약 불가)</span></h4>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <input type="date" id="bd-date" value="${today()}">
    <select id="bd-from">${HOURS.map(x=>`<option value="${x}">${x}:00</option>`).join('')}</select>
    ~ <select id="bd-to">${HOURS.map(x=>`<option value="${x}" ${x===22?'selected':''}>${x}:00</option>`).join('')}</select>
    <button class="btn small" onclick="addDateBlock()">차단 추가</button>
  </div>
  <div class="pill-row" style="margin-top:8px">
    ${DB.blocks.filter(b=>b.trainer===t&&b.date).sort((a,b)=>(a.date+String(a.hour).padStart(2,'0')).localeCompare(b.date+String(b.hour).padStart(2,'0'))).map(b=>`<span class="trainer-tag">${korDate(b.date)} ${b.hour}시 <b onclick="delBlock('${b.id}')">✕</b></span>`).join('')||'<span style="font-size:12px;color:var(--sub)">등록된 일회성 차단 없음</span>'}
  </div>
  <div class="modal-actions"><button class="btn" onclick="closeModal();render()">완료</button></div>`);
}
function addDateBlock(){
  const t=BLK_TRAINER;
  const d=document.getElementById('bd-date').value;
  const from=+document.getElementById('bd-from').value,to=+document.getElementById('bd-to').value;
  if(!d||to<from){alert('날짜와 시간 범위를 확인해 주세요.');return;}
  for(let hh=from;hh<=to;hh++){
    if(!DB.blocks.some(b=>b.trainer===t&&b.date===d&&b.hour===hh))
      DB.blocks.push({id:uid(),trainer:t,date:d,hour:hh,updatedAt:now()});
  }
  save();renderBlocks();
}
function delBlock(id){
  const i=DB.blocks.findIndex(b=>b.id===id);
  if(i>=0){tomb(id);DB.blocks.splice(i,1);save();renderBlocks();}
}
function toggleBlock(wd,h){
  const t=BLK_TRAINER;
  const i=DB.blocks.findIndex(x=>x.trainer===t&&x.weekday===wd&&!x.date&&x.hour===h);
  if(i>=0){tomb(DB.blocks[i].id);DB.blocks.splice(i,1);}
  else DB.blocks.push({id:uid(),trainer:t,weekday:wd,hour:h,updatedAt:now()});
  save();renderBlocks();
}

  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button><button class="btn" onclick="navigator.clipboard.writeText(document.getElementById('rm-out').value).then(()=>alert('복사되었습니다'))">전체 복사</button></div>`);

function genReminder(){
  const d=document.getElementById('rm-date').value;
  const tf=document.getElementById('rm-trainer').value;
  const list=DB.sessions.filter(s=>s.date===d&&s.status==='booked'&&(!tf||s.trainer===tf)).sort((a,b)=>a.hour-b.hour);
  const lines=list.map(s=>{const m=DB.members.find(x=>x.id===s.memberId);if(!m)return '';
    return `${m.name}님 — ${korDate(d)} ${s.hour}:00 (${s.trainer} 코치)\n[퍼스트피지오] ${m.name}님, 내일 ${korDate(d)} ${s.hour}시 수업이 예약되어 있습니다. 변경이 필요하시면 미리 연락 부탁드립니다 :)\n`;});
  document.getElementById('rm-out').value=lines.length?lines.join('\n'):'해당 날짜에 예약된 수업이 없습니다.';
}

/* 담당 코치 변경(인수인계) — 적용 시작일부터의 예약·회차·정산이 새 코치로 계산됨 */
function openTrainerChange(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return;
  const others=DB.trainers.filter(t=>t!==m.trainer);
  if(!others.length){alert('변경할 다른 코치가 없습니다.');return;}
  const nextMon=addDays(mondayOf(today()),7);
  openModal(`
  <h3>🔁 ${esc(m.name)} — 담당 코치 변경</h3>
  <div class="note" style="margin-bottom:12px">현재 담당: <b style="color:${tMeta(m.trainer).color}">${esc(m.trainer)}</b> · 진행 ${usedOf(m)}/${totalOf(m)}<br>
  적용 시작일 <b>이전</b> 수업(완료·예약)은 기존 코치의 기록·정산으로 남고, <b>이후 예약부터</b> 새 코치로 이동해 그 회차부터 새 코치 정산으로 계산됩니다.</div>
  <div class="frm">
    <div><label>새 담당 코치</label><select id="tc-to">${others.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
    <div><label>적용 시작일</label><input type="date" id="tc-from" value="${nextMon}" onchange="tcPreview('${mid}')"></div>
    <div class="full" id="tc-preview"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="openMember('${mid}')">뒤로</button>
  <button class="btn" onclick="applyTrainerChange('${mid}')">담당 변경 실행</button></div>`);
  tcPreview(mid);
}
function tcPreview(mid){
  const m=DB.members.find(x=>x.id===mid);
  const from=document.getElementById('tc-from').value;
  const moved=DB.sessions.filter(s=>s.memberId===mid&&s.date>=from&&['booked','done','noshow'].includes(s.status));
  const doneN=moved.filter(s=>s.status!=='booked').length;
  const om=ordinalMap(mid);
  const firstOrd=moved.length?Math.min(...moved.map(s=>om[s.id]||9999)):usedOf(m)+1;
  document.getElementById('tc-preview').innerHTML=
    `<div class="note">이동 대상: 예약 <b>${moved.length-doneN}건</b>${doneN?` + 이미 진행된 수업 <b>${doneN}건</b> (완료·노쇼 — 정산도 새 코치로 이동)`:''} · 새 코치 정산 시작: <b>${firstOrd}회차부터</b><br><span style="color:var(--sub)">적용일을 과거로 잡으면 그 이후 완료된 수업의 정산도 새 코치에게 넘어갑니다.</span></div>`;
}
function applyTrainerChange(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return;
  const to=document.getElementById('tc-to').value;
  const from=document.getElementById('tc-from').value;
  if(!from){alert('적용 시작일을 선택해 주세요.');return;}
  const fromT=m.trainer;
  const moved=DB.sessions.filter(s=>s.memberId===mid&&s.date>=from&&['booked','done','noshow'].includes(s.status));
  const om=ordinalMap(mid);
  const firstOrd=moved.length?Math.min(...moved.map(s=>om[s.id]||9999)):usedOf(m)+1;
  moved.forEach(s=>{s.trainer=to;s.updatedAt=now();});
  m.trainer=to;m.updatedAt=now();
  m.notes=((m.notes||'')+'\n['+today()+'] 담당 '+fromT+' → '+to+' 인수인계 (적용 '+from+', '+firstOrd+'회차부터)').trim();
  addEvent('staff',m.name+'님 담당 변경: '+fromT+' → '+to+' ('+from+'부터, 예약 '+moved.length+'건 이동)');
  save();openMember(mid);
}
/* 회차가 실제와 다를 때 직접 보정 — 세션 기록은 건드리지 않아 그 달 수업 횟수·정산에 영향 없음 */
function openFixCount(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return;
  openModal(`
  <h3>✏️ ${esc(m.name)} — 회차 보정</h3>
  <div class="note" style="margin-bottom:12px">현재 표시: <b>${usedOf(m)} / ${totalOf(m)}</b>. 아래에 <b>실제 사용 횟수</b>를 입력하면 이관분만 조정됩니다.<br>세션 기록은 그대로라서 <b>이번 달 수업 횟수·수업료 정산에는 영향이 없습니다.</b></div>
  <div class="frm">
    <div><label>실제 사용 횟수 *</label><input type="number" id="fx-used" value="${usedOf(m)}" min="0"></div>
    <div><label>총 횟수 (참고)</label><input type="number" value="${totalOf(m)}" disabled></div>
    <div class="full"><label>보정 사유 (선택)</label><input id="fx-memo" placeholder="예: 7월 초 수기 기록 누락 1회"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="openMember('${mid}')">뒤로</button>
  <button class="btn warn" onclick="applyFixCount('${mid}')">보정 저장</button></div>`);
}
function applyFixCount(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return;
  const target=+document.getElementById('fx-used').value;
  if(isNaN(target)||target<0){alert('올바른 횟수를 입력해 주세요.');return;}
  const rec=memberSessions(mid).filter(countable).length;
  if(target<rec){alert('시스템에 완료 기록만 '+rec+'회 있어 그보다 작게 설정할 수 없습니다.\n잘못된 완료 기록이 있다면 스케줄에서 해당 세션을 취소/삭제해 주세요.');return;}
  const before=usedOf(m);
  m.carryUsed=target-rec;
  const memo=document.getElementById('fx-memo').value.trim();
  m.notes=((m.notes||'')+'\n['+today()+'] 회차 보정 '+before+'→'+target+(memo?' ('+memo+')':'')).trim();
  m.updatedAt=now();
  addEvent('staff',m.name+'님 회차 보정: '+before+' → '+target+'/'+totalOf(m));
  save();openMember(mid);
}
function copyMemberLink(mid){
  if(location.protocol==='file:'){alert('아직 웹에 올리지 않아 링크가 작동하지 않습니다. 호스팅 주소에서 복사해 주세요.');return;}
  const url=location.href.split('?')[0]+'?book=1&m='+mid;
  navigator.clipboard.writeText(url).then(()=>alert('개인 예약 링크가 복사되었습니다.\n이 링크는 본인 화면으로 바로 열리며, 다른 회원 이름은 보이지 않습니다.'));

function delMember(mid){
  if(!confirm('회원과 모든 세션 기록을 삭제할까요? 되돌릴 수 없습니다.'))return;
  tomb(mid);
  memberSessions(mid).forEach(s=>tomb(s.id));
  DB.members=DB.members.filter(x=>x.id!==mid);
  DB.sessions=DB.sessions.filter(s=>s.memberId!==mid);
  save();closeModal();render();
}
function mfPerCalc(){const c=+document.getElementById('mf-count').value||0,a=+document.getElementById('mf-amount').value||0;if(c&&a)document.getElementById('mf-per').value=Math.round(a/c*0.5);}
function saveMember(mid){
  const name=document.getElementById('mf-name').value.trim();
  if(!name){alert('이름을 입력해 주세요.');return;}
  const base={name,phone:document.getElementById('mf-phone').value.trim(),trainer:document.getElementById('mf-trainer').value,
    program:document.getElementById('mf-program').value,status:document.getElementById('mf-status').value,
    referredBy:document.getElementById('mf-ref').value.trim(),pref:document.getElementById('mf-pref').value.trim(),
    goal:document.getElementById('mf-goal').value.trim(),notes:document.getElementById('mf-notes').value.trim(),updatedAt:now()};
  if(mid){
    const mm=DB.members.find(x=>x.id===mid);
    const oldT=mm.trainer;
    Object.assign(mm,base);
    const cv=document.getElementById('mf-carry');if(cv)mm.carryUsed=Math.max(0,+cv.value||0);
    if(oldT!==mm.trainer){
      const fut=DB.sessions.filter(s=>s.memberId===mid&&s.status==='booked'&&s.date>=today()&&s.trainer===oldT);
      if(fut.length&&confirm('담당 코치가 '+oldT+' → '+mm.trainer+'로 변경되었습니다.\n오늘 이후 예약 '+fut.length+'건도 새 코치로 옮길까요?\n(과거 수업 기록·정산은 기존 코치로 유지됩니다)')){
        fut.forEach(s=>{s.trainer=mm.trainer;s.updatedAt=now();});
      }
      mm.notes=((mm.notes||'')+'\n['+today()+'] 담당 '+oldT+' → '+mm.trainer).trim();
    }
  }
  else{
    const count=+document.getElementById('mf-count').value||0;
    if(!count){alert('첫 등록 횟수를 입력해 주세요.');return;}
    const per=+document.getElementById('mf-per').value||0;
    const amount=+document.getElementById('mf-amount').value||count*per;
    DB.members.push({id:uid(),...base,carryUsed:+document.getElementById('mf-carry').value||0,followUp:{status:'대기',memo:''},
      packages:[{id:uid(),date:document.getElementById('mf-pdate').value||today(),count,perPrice:per,amount}]});
  }
  save();closeModal();render();
}
function addPackage(mid){
  const m=DB.members.find(x=>x.id===mid);
  const last=(m.packages||[]).slice(-1)[0]||{};
  openModal(`
  <h3>${esc(m.name)} — 재등록 결제 추가</h3>
  <div class="note" style="margin-bottom:12px">현재 ${usedOf(m)}/${totalOf(m)} (잔여 ${remainOf(m)}회). 이 결제는 <b>${totalOf(m)+1}회차부터</b> 적용되며, 새 회당 가격도 그 회차부터 정산에 반영됩니다.</div>
  <div class="frm">
    <div><label>추가 횟수 *</label><input id="pk-count" type="number" min="1" value="${last.count||30}" oninput="pkPerCalc()"></div>
    <div><label>결제 금액 *</label><input id="pk-amount" type="number" placeholder="예: 1701000" oninput="pkPerCalc()"></div>
    <div class="full"><label>회당 가격 — 결제액÷횟수의 50% 자동 (수업료 정산용, 수정 가능)</label><input id="pk-per" type="number" value="${last.perPrice||''}"></div>
    <div><label>결제일</label><input id="pk-date" type="date" value="${today()}"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="openMember('${mid}')">뒤로</button>
  <button class="btn" onclick="savePackage('${mid}')">결제 저장 (재등록)</button></div>`);
}
function savePackage(mid){
  const c=+document.getElementById('pk-count').value||0;
  if(!c){alert('횟수를 입력해 주세요.');return;}
  const m=DB.members.find(x=>x.id===mid);
  m.packages.push({id:uid(),date:document.getElementById('pk-date').value,count:c,perPrice:+document.getElementById('pk-per').value||0,amount:+document.getElementById('pk-amount').value||0});
  m.followUp={status:'재등록 확정',memo:(m.followUp||{}).memo||'',date:today()};
  m.status='active';m.updatedAt=now();
  save();openMember(mid);
}
function pkPerCalc(){const c=+document.getElementById('pk-count').value||0,a=+document.getElementById('pk-amount').value||0;if(c&&a)document.getElementById('pk-per').value=Math.round(a/c*0.5);}
function editPackage(mid,pid){
  const m=DB.members.find(x=>x.id===mid);const p=m.packages.find(x=>x.id===pid);if(!p)return;
  openModal(`
  <h3>${esc(m.name)} — 결제 수정</h3>
  <div class="note" style="margin-bottom:12px">횟수를 줄이면 총 횟수가 함께 줄어듭니다. 현재 사용 ${usedOf(m)}회이므로 총 횟수가 그보다 작아지면 만료로 표시됩니다.</div>
  <div class="frm">
    <div><label>횟수 *</label><input id="pk-count" type="number" min="1" value="${p.count}" oninput="pkPerCalc()"></div>
    <div><label>결제 금액</label><input id="pk-amount" type="number" value="${p.amount||0}" oninput="pkPerCalc()"></div>
    <div class="full"><label>회당 가격 — 결제액÷횟수의 50% 자동 (수업료 정산용, 수정 가능)</label><input id="pk-per" type="number" value="${p.perPrice||0}"></div>
    <div><label>결제일 ${p.date?'':'(이관분 — 비워두면 매출 미집계)'}</label><input id="pk-date" type="date" value="${p.date||''}"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="openMember('${mid}')">뒤로</button>
  <button class="btn" onclick="updatePackage('${mid}','${pid}')">저장</button></div>`);
}
function updatePackage(mid,pid){
  const m=DB.members.find(x=>x.id===mid);const p=m.packages.find(x=>x.id===pid);
  const c=+document.getElementById('pk-count').value||0;
  if(!c){alert('횟수를 입력해 주세요.');return;}
  p.count=c;p.perPrice=+document.getElementById('pk-per').value||0;
  p.amount=+document.getElementById('pk-amount').value||0;
  p.date=document.getElementById('pk-date').value;
  m.updatedAt=now();
  addEvent('staff',m.name+'님 결제 내역 수정 ('+c+'회)');
  save();openMember(mid);
}
function deletePackage(mid,pid){
  const m=DB.members.find(x=>x.id===mid);const p=m.packages.find(x=>x.id===pid);if(!p)return;
  if(m.packages.length<=1){alert('마지막 결제(패키지)는 삭제할 수 없습니다. 대신 [수정]으로 내용을 고치세요.');return;}
  if(!confirm(p.count+'회 ('+fmtW(p.amount)+') 결제를 삭제할까요? 총 횟수가 '+(totalOf(m)-p.count)+'회로 줄어듭니다.'))return;
  m.packages=m.packages.filter(x=>x.id!==pid);
  m.updatedAt=now();
  addEvent('staff',m.name+'님 결제 내역 삭제 ('+p.count+'회)');
  save();openMember(mid);
}

/* ================= 그룹(GX) 회원 관리 ================= */
let GXM_FILTER='active';
function viewGxMembers(){
  let list=(DB.gxMembers||[]).filter(m=>GXM_FILTER==='all'||(GXM_FILTER==='active'?m.status!=='ended':m.status===GXM_FILTER));
  list.sort((a,b)=>((daysLeft(a.end)??9999)-(daysLeft(b.end)??9999)));
  const soon=list.filter(m=>m.status==='active'&&daysLeft(m.end)!==null&&daysLeft(m.end)<=10&&daysLeft(m.end)>=0).length;
  const over=list.filter(m=>m.status==='active'&&daysLeft(m.end)!==null&&daysLeft(m.end)<0).length;
  return `
  <div class="toolbar">
    <select onchange="GXM_FILTER=this.value;render()">
      <option value="active" ${GXM_FILTER==='active'?'selected':''}>활성+정지</option>
      <option value="paused" ${GXM_FILTER==='paused'?'selected':''}>정지만</option>
      <option value="ended" ${GXM_FILTER==='ended'?'selected':''}>종료</option>
      <option value="all" ${GXM_FILTER==='all'?'selected':''}>전체</option>
    </select>
    ${soon?`<span class="badge b-warn">만료 10일 이내 ${soon}명</span>`:''}
    ${over?`<span class="badge b-bad">만료 ${over}명</span>`:''}
    <span class="sp"></span>
    <button class="btn" onclick="openGxMember()">+ 그룹 회원 등록</button>
  </div>
  <div class="card">
    <table><thead><tr><th>이름</th><th>연락처</th><th>시작일</th><th>종료일</th><th>남은 기간</th><th>상태</th><th>메모</th><th></th></tr></thead>
    <tbody>${list.length?list.map(m=>{
      const dl=daysLeft(m.end);
      let dlBadge='-';
      if(dl!==null){
        if(m.status==='paused')dlBadge='<span class="badge b-gray">정지 중</span>';
        else if(dl<0)dlBadge=`<span class="badge b-bad">만료 +${-dl}일</span>`;
        else if(dl<=10)dlBadge=`<span class="badge b-warn">D-${dl} 🔔</span>`;
        else dlBadge=`<span class="mono">D-${dl}</span>`;
      }
      return `<tr class="clickable" onclick="openGxMember('${m.id}')">
        <td><b>${esc(m.name)}</b></td><td class="mono" style="font-size:12px">${esc(m.phone||'-')}</td>
        <td class="mono">${m.start||'-'}</td><td class="mono">${m.end||'-'}</td>
        <td>${dlBadge}</td>
        <td>${m.status==='paused'?`<span class="badge b-gray">정지</span>`:m.status==='ended'?'<span class="badge b-gray">종료</span>':'<span class="badge b-ok">활성</span>'}</td>
        <td style="font-size:12px;color:var(--sub);max-width:220px">${esc((m.status==='paused'?('['+(m.pauseReason||'정지')+'] '):'')+(m.memo||''))}</td>
        <td style="white-space:nowrap;text-align:right" onclick="event.stopPropagation()">
          <button class="btn small" onclick="openGxExtend('${m.id}')">${m.status==='ended'?'재등록':'연장'}</button>
          ${m.status==='ended'?''
            :m.status==='paused'
            ?`<button class="btn small warn" onclick="resumeGxMember('${m.id}')">재개</button>`
            :`<button class="btn small ghost" onclick="pauseGxMember('${m.id}')">정지</button>`}
          ${m.status!=='ended'?`<button class="btn small ghost" style="color:var(--bad)" onclick="endGxMember('${m.id}')">종료</button>`:''}
        </td></tr>`;}).join(''):`<tr><td colspan="8" class="empty">그룹 회원이 없습니다.</td></tr>`}</tbody></table>
    <div class="note" style="margin-top:10px">정지하면 기간이 멈추고, [재개] 시 정지한 일수만큼 종료일이 자동으로 밀립니다. 연장 시 금액을 입력하면 GX 결제 원장에도 자동 기록됩니다.</div>
  </div>`;
}

  openModal(`

    <div><label>등록 개월 *</label><select id="gm-months" onchange="gmCalcEnd()"><option value="1">1개월</option><option value="3" selected>3개월</option><option value="5">5개월</option><option value="8">8개월</option><option value="12">12개월</option></select></div>

    <div><label>결제 금액 (부가세 제외) — GX 결제 원장 자동 기록</label><input type="number" id="gm-amount" placeholder="예: 500000"></div>`}
    <div><label>종료일 ${m?'*':'(자동 계산, 수정 가능)'}</label><input type="date" id="gm-end" value="${m?m.end:''}"></div>
    <div class="full"><label>메모 (등록 내용·이벤트 등)</label><input id="gm-memo" value="${m?esc(m.memo||''):''}"></div>
    ${m&&m.status==='paused'?`<div class="full"><div class="note warn">정지 중 (${m.pausedAt}부터) — 사유: ${esc(m.pauseReason||'-')}</div></div>`:''}
  </div>
  <div class="modal-actions">
    ${m?`<button class="btn ghost" style="color:var(--bad);margin-right:auto" onclick="if(confirm('이 그룹 회원을 삭제할까요?')){tomb('${m.id}');DB.gxMembers=DB.gxMembers.filter(x=>x.id!=='${m.id}');save();closeModal();render();}">삭제</button>`:''}
    <button class="btn ghost" onclick="closeModal()">닫기</button>
    <button class="btn" onclick="saveGxMember('${m?m.id:''}')">저장</button>
  </div>`);
  if(!m)gmCalcEnd();
}
function gmCalcEnd(){
  const s=document.getElementById('gm-start').value;if(!s)return;
  const mo=+((document.getElementById('gm-months')||{}).value||0);
  const wk=+((document.getElementById('gm-weeks')||{}).value||0);
  if(!mo)return;
  const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+mo);
  document.getElementById('gm-end').value=addDays(ymd(d),wk*7);
}
function saveGxMember(id){
  const name=document.getElementById('gm-name').value.trim();
  const end=document.getElementById('gm-end').value;
  if(!name||!end){alert('이름과 종료일을 입력해 주세요.');return;}
  const start=document.getElementById('gm-start').value;
  const base={name,phone:document.getElementById('gm-phone').value.trim(),start,end,memo:document.getElementById('gm-memo').value.trim(),updatedAt:now()};
  if(id)Object.assign(DB.gxMembers.find(x=>x.id===id),base);
  else{
    DB.gxMembers.push({id:uid(),...base,status:'active',pausedAt:'',pauseReason:''});
    const mo=+((document.getElementById('gm-months')||{}).value||0);
    const amt=+((document.getElementById('gm-amount')||{}).value||0);
    if(amt&&mo){
      DB.gxPay.push({id:uid(),name,date:start,months:mo,amount:amt,updatedAt:now()});
      addEvent('staff','GX 신규 결제: '+name+' '+mo+'개월 '+fmtW(amt));
    }
  }
  save();closeModal();render();
}
function pauseGxMember(id){
  const m=DB.gxMembers.find(x=>x.id===id);if(!m)return;
  openModal(`
  <h3>${esc(m.name)} — 정지</h3>
  <div class="frm">
    <div><label>정지 시작일</label><input type="date" id="gp-pdate" value="${today()}"></div>
    <div class="full"><label>정지 사유 *</label><input id="gp-reason" placeholder="예: 해외 출장 2주, 부상"></div>
  </div>
  <div class="note" style="margin-top:8px">재개할 때 정지 일수만큼 종료일(${m.end})이 자동으로 연장됩니다.</div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button>
  <button class="btn warn" onclick="(function(){const r=document.getElementById('gp-reason').value.trim();if(!r){alert('사유를 입력해 주세요.');return;}
    const m2=DB.gxMembers.find(x=>x.id==='${id}');m2.status='paused';m2.pausedAt=document.getElementById('gp-pdate').value;m2.pauseReason=r;m2.updatedAt=now();
    addEvent('staff','그룹 회원 정지: '+m2.name+' ('+r+')');save();closeModal();render();})()">정지 처리</button></div>`);
}
function resumeGxMember(id){
  const m=DB.gxMembers.find(x=>x.id===id);if(!m||m.status!=='paused')return;
  const days=Math.max(0,Math.ceil((new Date(today()+'T00:00:00')-new Date(m.pausedAt+'T00:00:00'))/86400000));
  if(!confirm(m.name+'님을 오늘부터 재개할까요?\n정지 '+days+'일 → 종료일이 '+m.end+' → '+addDays(m.end,days)+'로 연장됩니다.'))return;
  m.end=addDays(m.end,days);
  m.memo=((m.memo||'')+' · 정지 '+m.pausedAt+'~'+today()+'('+(m.pauseReason||'')+')').trim();
  m.status='active';m.pausedAt='';m.pauseReason='';m.updatedAt=now();
  addEvent('staff','그룹 회원 재개: '+m.name+' (+'+days+'일 연장)');
  save();render();
}
function endGxMember(id){
  const m=DB.gxMembers.find(x=>x.id===id);if(!m)return;
  const reason=prompt(m.name+'님을 종료 처리합니다. 사유를 입력하세요 (선택):','');
  if(reason===null)return;
  m.status='ended';m.pausedAt='';m.pauseReason='';
  m.memo=((m.memo||'')+' · '+today()+' 종료'+(reason?'('+reason+')':'')).trim();
  m.updatedAt=now();
  addEvent('staff','그룹 회원 종료: '+m.name+(reason?' ('+reason+')':''));
  save();render();
}
function openGxExtend(id){
  const m=DB.gxMembers.find(x=>x.id===id);if(!m)return;
  openModal(`
  <h3>${esc(m.name)} — 기간 연장</h3>
  <div class="note" style="margin-bottom:10px">현재 종료일: <b>${m.end}</b>${daysLeft(m.end)<0?' (만료됨 — 오늘부터 연장 계산)':''}</div>
  <div class="frm">
    <div><label>연장 개월</label><select id="ge-months"><option value="0">없음</option><option value="1">1개월</option><option value="3" selected>3개월</option><option value="5">5개월</option><option value="8">8개월</option><option value="12">12개월</option></select></div>
    <div><label>추가 주 (이벤트)</label><select id="ge-weeks"><option value="0">없음</option><option value="1">+1주</option><option value="2">+2주</option><option value="3">+3주</option></select></div>
    <div><label>추가 일 (일 단위 보정)</label><input type="number" id="ge-days" value="0" min="0" placeholder="예: 5"></div>
    <div class="full"><label>결제 금액 (부가세 제외, 입력 시 GX 결제 원장에 자동 기록)</label><input type="number" id="ge-amount" placeholder="예: 500000"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button>
  <button class="btn" onclick="applyGxExtend('${id}')">연장 저장</button></div>`);
}
function applyGxExtend(id){
  const m=DB.gxMembers.find(x=>x.id===id);if(!m)return;
  const mo=+document.getElementById('ge-months').value||0;
  const wk=+document.getElementById('ge-weeks').value||0;
  const dd=+document.getElementById('ge-days').value||0;
  const amt=+document.getElementById('ge-amount').value||0;
  if(!mo&&!wk&&!dd){alert('연장할 기간을 입력해 주세요.');return;}
  let base=(daysLeft(m.end)!==null&&daysLeft(m.end)<0)?today():m.end;
  const d=new Date(base+'T00:00:00');d.setMonth(d.getMonth()+mo);
  m.end=addDays(ymd(d),wk*7+dd);
  m.memo=((m.memo||'')+' · '+today()+' 연장 '+(mo?mo+'개월':'')+(wk?'+'+wk+'주':'')+(dd?'+'+dd+'일':'')).trim();
  m.status='active';m.updatedAt=now();
  if(amt){DB.gxPay.push({id:uid(),name:m.name,date:today(),months:mo,amount:amt,updatedAt:now()});}
  addEvent('staff','그룹 회원 연장: '+m.name+' '+mo+'개월'+(wk?'+'+wk+'주':'')+' → '+m.end);
  save();closeModal();render();
}

/* ================= 재등록 관리 ================= */
function viewRenew(){
  const golden=goldenList(),expired=expiredList();
  const mk=today().slice(0,7);
  const renewed=DB.members.filter(m=>(m.packages||[]).some((p,i)=>i>0&&monthKey(p.date)===mk));
  const churned=DB.members.filter(m=>m.status==='ended');
  function row(m){
    const f=m.followUp||{status:'대기',memo:''};
    return `<tr>
      <td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td>
      <td>${esc(m.trainer)}</td>
      <td class="mono" style="font-weight:700">${usedOf(m)}/${totalOf(m)}</td>
      <td>${remainOf(m)<=0?'<span class="badge b-bad">만료</span>':`<span class="badge b-warn">${remainOf(m)}회</span>`}</td>
      <td>${esc(m.pref||'-')}</td>
      <td><select onchange="setFollow('${m.id}','status',this.value)">${FOLLOW.map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select></td>
      <td><input value="${esc(f.memo||'')}" placeholder="메모" onchange="setFollow('${m.id}','memo',this.value)" style="width:100%"></td>
      <td><button class="btn small" onclick="addPackage('${m.id}')">결제</button></td>
    </tr>`;
  }
  return `
  ${(function(){
    let months=[];{let d=new Date(today().slice(0,7)+'-01T00:00:00');for(let i=5;i>=0;i--){const t=new Date(d);t.setMonth(t.getMonth()-i);months.push(ymd(t).slice(0,7));}}
    const rows=months.map(k=>{
      let renew=0,newM=0;
      DB.members.forEach(m=>(m.packages||[]).forEach((p,i)=>{if(monthKey(p.date)===k){if(i>0)renew++;else newM++;}}));
      const churn=DB.members.filter(m=>m.status==='ended'&&monthKey(m.endedAt||'')===k).length;
      const rate=(renew+churn)?Math.round(renew/(renew+churn)*100):null;
      return {k,renew,newM,churn,rate};
    });
    return `<div class="card"><h2>재등록 통계 <span class="hint">최근 6개월 · 재등록률 = 재등록 ÷ (재등록+이탈)</span></h2>
    <table><thead><tr><th>월</th>${rows.map(r=>`<th class="mono">${r.k.slice(5)}월</th>`).join('')}</tr></thead><tbody>
    <tr><td><b>신규 등록</b></td>${rows.map(r=>`<td class="mono">${r.newM}</td>`).join('')}</tr>
    <tr><td><b>재등록</b></td>${rows.map(r=>`<td class="mono" style="font-weight:800">${r.renew}</td>`).join('')}</tr>
    <tr><td><b>이탈</b></td>${rows.map(r=>`<td class="mono" style="color:var(--bad)">${r.churn}</td>`).join('')}</tr>
    <tr><td><b>재등록률</b></td>${rows.map(r=>`<td class="mono">${r.rate===null?'-':r.rate+'%'}</td>`).join('')}</tr>
    </tbody></table>
    <h2 style="margin-top:18px">코치별 재등록률 <span class="hint">최근 6개월 합계</span></h2>
    <table><thead><tr><th>코치</th><th>이번 달 재등록</th><th>6개월 재등록</th><th>6개월 이탈</th><th>재등록률</th></tr></thead><tbody>
    ${DB.trainers.map(t=>{
      let renew6=0,renewM=0;
      DB.members.filter(m=>m.trainer===t).forEach(m=>(m.packages||[]).forEach((p,i)=>{
        if(i>0){const k=monthKey(p.date);if(months.includes(k))renew6++;if(k===months[5])renewM++;}
      }));
      const churn6=DB.members.filter(m=>m.trainer===t&&m.status==='ended'&&months.includes(monthKey(m.endedAt||''))).length;
      const rate=(renew6+churn6)?Math.round(renew6/(renew6+churn6)*100):null;
      return `<tr><td><b style="color:${tMeta(t).color}">${esc(t)}</b></td><td class="mono">${renewM}건</td><td class="mono">${renew6}건</td><td class="mono" style="color:var(--bad)">${churn6}</td><td>${rate===null?'<span style="color:var(--sub)">-</span>':`<b class="mono">${rate}%</b>`}</td></tr>`;
    }).join('')}
    </tbody></table></div>`;
  })()}
  <div class="note" style="margin-bottom:14px"><b>재등록 플레이북</b> — 잔여 3회 도달 시 자동으로 올라옵니다. ① 잔여 3회: 성과 리뷰 + 재등록 안내 → ② 잔여 1회: 결제 확정 → ③ 만료 후 7일 내 미등록 시 이탈 처리·사유 기록. <b>시스템이 타이밍을 알려주는 구조</b>입니다.</div>
  <div class="card"><h2>🔔 재등록 골든타임 <span class="hint">잔여 3회 이하 — 자동 추출</span></h2>
    ${golden.length||expired.length?`<table><thead><tr><th>회원</th><th>담당</th><th>진행</th><th>잔여</th><th>가능 시간</th><th>팔로업</th><th>메모</th><th></th></tr></thead>
    <tbody>${expired.map(row).join('')}${golden.sort((a,b)=>remainOf(a)-remainOf(b)).map(row).join('')}</tbody></table>`
    :'<div class="empty">재등록 임박 회원 없음</div>'}
  </div>
  <div class="two-col">
    <div class="card"><h2>이번 달 재등록 완료 <span class="hint">${mk}</span></h2>
      ${renewed.length?`<table><tbody>${renewed.map(m=>{const p=(m.packages||[]).filter((x,i)=>i>0&&monthKey(x.date)===mk);return `<tr><td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td><td>${esc(m.trainer)}</td><td class="mono">${p.map(x=>x.count+'회 · '+fmtW(x.amount)).join(', ')}</td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">이번 달 재등록 없음</div>'}
    </div>
    <div class="card"><h2>이탈 회원</h2>
      ${churned.length?`<table><tbody>${churned.map(m=>`<tr><td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td><td>${esc(m.trainer)}</td><td class="mono">${usedOf(m)}/${totalOf(m)}</td><td style="color:var(--sub);font-size:12px">${esc((m.followUp||{}).memo||m.notes||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">이탈 기록 없음</div>'}
    </div>
  </div>`;
}
function setFollow(mid,k,v){const m=DB.members.find(x=>x.id===mid);m.followUp=m.followUp||{status:'대기',memo:''};m.followUp[k]=v;m.updatedAt=now();if(k==='status'&&v==='이탈'){m.status='ended';m.endedAt=today();}save();render();}
