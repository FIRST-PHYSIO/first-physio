Pv2Ywc0CpchAefmubBVgDZvhuK/jhsZ7MHGBADsLDXSWzkKvCDJdtBT8cVS8Lv0LMcDaQ4oeLimWVWi1muNnK4ofxKmWVXTlm/Cdd%2BAmGrsDvOBi8bDJqgRnW5cAPg3Ww0lZoMQYvj4wasWpPclTQD5vrtdhWKtViLF8G1uUIrIj9dPQhRzBFvDRNT3IEUMTXLOVPDqeKeByxvcrhSBG/Oy/fchhXxPuGPIIc1iwJ8yZNKDlKFCXku3Zh5UggSvi3cSshR1d0qeAnPhWVA/LA7ZCAHIAcgByAHIAcgByAHIAcgByAHADIAcgByAHIAcgBtvgN%2BHi5hzid2scAAAAASUVORK5CYII%3D%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image/png%22%7D%5D%7D">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1a2233; --sub:#68738a; --line:#e3e8f0;
  --brand:#1e5eff; --brand-soft:#eaf0ff; --ok:#0eab6b; --ok-soft:#e5f8f0;
  --warn:#e8930c; --warn-soft:#fdf3e2; --bad:#e0364b; --bad-soft:#fdeaed;
  --violet:#7048e8; --violet-soft:#f0ebfd;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:#101a33;color:#fff;padding:0 16px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:50}
header h1{font-size:15px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
header h1 span{color:#7ea2ff}
nav{display:flex;gap:2px;height:100%;overflow-x:auto}
nav button{background:none;border:none;color:#9aa7c4;font-size:13.5px;font-weight:600;padding:0 12px;cursor:pointer;height:100%;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
nav button.on{color:#fff;border-bottom-color:var(--brand)}
nav button:hover{color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync-dot{font-size:11.5px;color:#9aa7c4;display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync-dot i{width:8px;height:8px;border-radius:50%;background:#98a1b3;display:inline-block}
.sync-dot.on i{background:#3ecf8e}
.sync-dot.err i{background:#ff6b81}
.bell{position:relative;background:none;border:none;color:#cdd6ea;font-size:18px;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-8px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:1px 5px}
main{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font-size:12px;color:var(--sub);font-weight:500}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k-label{font-size:12px;color:var(--sub);font-weight:600}
.kpi .k-val{font-size:23px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.kpi .k-sub{font-size:11.5px;color:var(--sub);margin-top:2px}
.kpi.alert{border-color:#f3c98b;background:#fffaf1}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--sub);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#f7f9fd}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:700}
.b-blue{background:var(--brand-soft);color:var(--brand)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-vio{background:var(--violet-soft);color:var(--violet)}
.b-gray{background:#eef1f6;color:var(--sub)}
.progress{background:#edf0f6;border-radius:99px;height:8px;width:100px;overflow:hidden;display:inline-block;vertical-align:middle}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px}
.progress i.full{background:var(--bad)}
.progress i.near{background:var(--warn)}
button.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
button.btn:hover{filter:brightness(1.08)}
button.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.btn.ghost:hover{background:#f5f7fb;filter:none}
button.btn.danger{background:var(--bad)}
button.btn.warn{background:var(--warn)}
button.btn.small{padding:5px 10px;font-size:12px}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid #cdd5e1;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b9ccff;border-color:var(--brand)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.day-tabs{display:flex;gap:4px;flex-wrap:wrap}
.day-tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--sub);font-family:inherit}
.day-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--sub);font-family:inherit}
.seg button.on{background:var(--brand);color:#fff}
.sched-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.sched{border-collapse:collapse;width:100%}
.sched th{background:#f8fafd;padding:8px 6px;text-align:center;border-bottom:2px solid var(--line);border-right:1px solid var(--line);font-size:12px}
.sched td{border:1px solid var(--line);padding:3px;min-width:110px;height:44px;vertical-align:top;cursor:pointer}
.sched td:hover{background:#f5f8ff}
.sched td.time{background:#f8fafd;font-weight:700;color:var(--sub);text-align:center;min-width:56px;cursor:default;font-size:12px}
.sched td.blocked{background:repeating-linear-gradient(45deg,#f0f2f6,#f0f2f6 6px,#e6e9f0 6px,#e6e9f0 12px);cursor:not-allowed}
.sched td.past-col{background:#fbfcfe}
.chip{border-radius:6px;padding:3px 6px;font-size:11.5px;font-weight:600;margin-bottom:2px;line-height:1.3;cursor:pointer}
.chip .cnt{font-weight:800}
.chip .tt{opacity:.75;font-weight:700}
.chip.booked{background:var(--brand-soft);color:#1a49c2;border:1px dashed #9db7f5}
.chip.done{background:var(--ok-soft);color:#087a4c;border:1px solid #bfead7}
.chip.noshow{background:var(--bad-soft);color:var(--bad);border:1px solid #f5c6cd}
.chip.cancelled{background:#f0f2f6;color:#98a1b3;border:1px solid var(--line);text-decoration:line-through}
.chip.late_cancel{background:var(--warn-soft);color:#8a5a08;border:1px solid #f3d9a8}
.chip.over{outline:2px solid var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:36px 14px;overflow-y:auto}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:600px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:14px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin-bottom:4px}
.frm input,.frm select,.frm textarea{width:100%}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.note{font-size:12.5px;color:var(--sub);background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.6}
.note.warn{background:var(--warn-soft);border-color:#f3d9a8;color:#8a5a08}
.note.bad{background:var(--bad-soft);border-color:#f5c6cd;color:#a1202f}
.note.ok{background:var(--ok-soft);border-color:#bfead7;color:#087a4c}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar{width:70%;max-width:48px;background:linear-gradient(180deg,#4d82ff,#1e5eff);border-radius:6px 6px 2px 2px;min-height:2px}
.bar-col .bv{font-size:11px;font-weight:700}
.bar-col .bl{font-size:11px;color:var(--sub)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.help p{margin-bottom:10px;line-height:1.75}
.help h4{margin:16px 0 6px;font-size:14px}
.help .src{color:var(--sub);font-size:12px}
.help ol{margin:6px 0 10px 20px;line-height:1.9}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.empty{color:var(--sub);text-align:center;padding:22px;font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.hist{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:8px}
.hist table td,.hist table th{padding:6px 10px;font-size:12.5px}
.trainer-tag{display:inline-flex;align-items:center;gap:6px;background:#eef1f6;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.trainer-tag b{cursor:pointer;color:var(--bad)}
.duty-line{margin-top:3px;display:flex;gap:3px;justify-content:center;flex-wrap:wrap}
.duty-b{font-size:9.5px;font-weight:800;border-radius:4px;padding:1px 5px}
code.sql{display:block;background:#101a33;color:#cfe0ff;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;line-height:1.6;margin:8px 0}
.block-grid{border-collapse:collapse}
.block-grid td,.block-grid th{border:1px solid var(--line);padding:0;text-align:center;font-size:11.5px}
.block-grid td{width:44px;height:26px;cursor:pointer}
.block-grid td.b{background:repeating-linear-gradient(45deg,#f6d7db,#f6d7db 5px,#f0c2c8 5px,#f0c2c8 10px)}
.evt{padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.5}
.evt .t{color:var(--sub);font-size:11px}
/* ---------- 모바일 ---------- */
@media(max-width:700px){
  header{height:50px;padding:0 10px;gap:8px}
  header h1{font-size:13px}
  nav button{padding:0 8px;font-size:12.5px}
  main{padding:10px}
  .toolbar{gap:6px}
  .toolbar .btn{padding:7px 10px;font-size:12px}
  .grid-kpi{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi .k-val{font-size:19px}
  .card{padding:12px;border-radius:10px}
  .sched td{min-width:96px;height:40px}
  .sched td.time{min-width:44px}
  .modal{padding:16px;border-radius:12px}
  .frm{grid-template-columns:1fr}
  .overlay{padding:14px 8px}
  th,td{padding:7px 6px}
  .progress{width:64px}
  .slot{width:calc(25% - 5px)}
  input,select,textarea{font-size:16px} /* iOS 확대 방지 */
}
/* 회원 예약 모드 */
.book-wrap{max-width:640px;margin:0 auto;padding:20px 14px}
.book-hd{text-align:center;margin-bottom:16px}
.book-hd h1{font-size:20px;font-weight:800}
.book-hd h1 span{color:var(--brand)}
.slot-day{margin-bottom:10px}
.slot-day .d{font-weight:800;font-size:13px;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff;width:64px;text-align:center;font-family:inherit}
.slot.open:hover{border-color:var(--brand);color:var(--brand)}
.slot.mine{background:var(--brand);border-color:var(--brand);color:#fff}
.slot.taken{background:#f0f2f6;color:#b6bdcc;cursor:not-allowed;text-decoration:line-through}
.slot.closed{background:#fbfbfd;color:#ccd2df;cursor:not-allowed}
.slot.blockedS{background:repeating-linear-gradient(45deg,#f0f2f6,#f0f2f6 5px,#e6e9f0 5px,#e6e9f0 10px);color:#b6bdcc;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
/* ================= 상수 ================= */
const KEY='firstphysio_claude_v3';

/* ================= 데이터 ================= */
let DB=null;
function fresh(){return {members:[],sessions:[],blocks:[],events:[],deleted:[],trainers:['홍웅표','신종수','김택연','정병건','장동진','김강윤'],trainerMeta:{},duty:JSON.parse(JSON.stringify(DEFAULT_DUTY)),noshowDeduct:true,metaTs:Date.now(),seq:1};}
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.members){DB=d;DB.blocks=DB.blocks||[];DB.events=DB.events||[];DB.deleted=DB.deleted||[];DB.trainerMeta=DB.trainerMeta||{};DB.duty=DB.duty||JSON.parse(JSON.stringify(DEFAULT_DUTY));dedupeSessions();return;}}catch(e){}
  DB=fresh();importSeed();dedupeSessions();
}
/* 같은 회원·같은 날짜·같은 시간 세션은 1건만 유효 (수업 1회=1시간 원칙).
   기기 간 병합·이중 입력으로 중복이 생겨도 실행/동기화 때마다 자동 정리되고 서버에도 전파된다. */
function dedupeSessions(){
  const rank={done:4,noshow:3,late_cancel:2,booked:1,cancelled:0};
  const seen={};const del=new Set();
  DB.sessions.slice().sort((a,b)=>(rank[b.status]||0)-(rank[a.status]||0)||(a.updatedAt||0)-(b.updatedAt||0)).forEach(s=>{
    const k=s.memberId+'|'+s.date+'|'+s.hour;
    if(seen[k])del.add(s.id);else seen[k]=true;
  });
  if(del.size){
    DB.sessions=DB.sessions.filter(s=>!del.has(s.id));
    del.forEach(id=>DB.deleted.push({id,ts:now()}));
    saveLocal();
  }
  return del.size;
}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(DB));}
function save(){saveLocal();schedulePush();}
function uid(){return 'id'+(DB.seq++)+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function now(){return Date.now();}
function fmtW(n){return '₩'+(n||0).toLocaleString('ko-KR');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function importSeed(){
  REAL_SEED.members.forEach(m=>DB.members.push({...m,updatedAt:now()}));
  REAL_SEED.sessions.forEach(s=>DB.sessions.push({...s,id:uid(),updatedAt:now()}));
  saveLocal();
}

/* ===== 핵심 규칙: 횟수는 수기 입력 금지 — 기록에서 자동 계산 ===== */
function countable(s){return s.status==='done'||(DB.noshowDeduct&&s.status==='noshow');}
function memberSessions(mid){return DB.sessions.filter(s=>s.memberId===mid);}
function usedOf(m){return (m.carryUsed||0)+memberSessions(m.id).filter(countable).length;}
function totalOf(m){return (m.packages||[]).reduce((a,p)=>a+(+p.count||0),0);}
function perOf(m){const p=(m.packages||[]).slice(-1)[0];return p?(+p.perPrice||0):0;}
function remainOf(m){return totalOf(m)-usedOf(m);}
function ordinalMap(mid){
  const m=DB.members.find(x=>x.id===mid);if(!m)return {};
  const list=memberSessions(mid).filter(s=>countable(s)||s.status==='booked')
    .sort((a,b)=>(a.date+String(a.hour).padStart(2,'0')).localeCompare(b.date+String(b.hour).padStart(2,'0')));
  const map={};let n=m.carryUsed||0;
  list.forEach(s=>{n++;map[s.id]=n;});
  return map;
}

function autoInitial(t){

let SYNC={state:'local',lastPull:0,syncedVer:null,pushTimer:null,pulling:false};
const DEFAULT_SYNC={url:'https://kjxlpznsklnnijzskmeb.supabase.co',key:'sb_publishable_dCavLEzrgm4RkvpB4yGckA_RRVCYcNN'};
function getCfg(){try{const c=JSON.parse(localStorage.getItem(CFGKEY));if(c&&c.url&&c.key)return c;}catch(e){}return DEFAULT_SYNC;}
function setCfg(url,key){localStorage.setItem(CFGKEY,JSON.stringify({url:url.replace(/\/+$/,''),key}));}
function hdrs(cfg){return {'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'};}
function syncBody(){const d={...DB};delete d._local;return d;}
function mergeCol(a,b,deleted){
  const map={};
  (a||[]).forEach(x=>map[x.id]=x);
  (b||[]).forEach(x=>{if(!map[x.id]||(x.updatedAt||0)>(map[x.id].updatedAt||0))map[x.id]=x;});
  const del=new Set((deleted||[]).map(d=>d.id));
  return Object.values(map).filter(x=>!del.has(x.id));
}
function mergeDB(local,remote){
  if(!remote||!remote.members)return local;
  const deleted=mergeCol(local.deleted||[],remote.deleted||[],[]).slice(0,800);
  const out={...local};
  out.deleted=deleted;
  ['members','sessions','blocks','events'].forEach(k=>out[k]=mergeCol(local[k],remote[k],deleted));
  out.events.sort((a,b)=>b.ts-a.ts);out.events=out.events.slice(0,300);
  if((remote.metaTs||0)>(local.metaTs||0)){out.trainers=remote.trainers;out.noshowDeduct=remote.noshowDeduct;out.trainerMeta=remote.trainerMeta||{};out.duty=remote.duty||local.duty;out.metaTs=remote.metaTs;}
  out.seq=Math.max(local.seq||1,remote.seq||1);
  return out;
}
async function pullSync(force){
  const cfg=getCfg();if(!cfg||SYNC.pulling)return;
  SYNC.pulling=true;
  try{
    const r=await fetch(cfg.url+'/rest/v1/fp_store?id=eq.1&select=data,version',{headers:hdrs(cfg)});
    if(!r.ok)throw new Error(r.status);
    const rows=await r.json();
    if(!rows.length){await pushInit(cfg);SYNC.state='on';}
    else if(rows[0].version!==SYNC.syncedVer||force){
      const prevEvts=(DB.events||[]).length?DB.events[0].ts:0;
      DB=mergeDB(DB,rows[0].data);
      SYNC.syncedVer=rows[0].version;
      saveLocal();
      if(dedupeSessions())schedulePush();
      SYNC.state='on';
      notifyNew(prevEvts);
      if(!document.getElementById('overlay').classList.contains('show'))render();
    }else SYNC.state='on';
    SYNC.lastPull=now();
  }catch(e){SYNC.state='err';}
  SYNC.pulling=false;updateSyncDot();
}
async function pushInit(cfg){
  await fetch(cfg.url+'/rest/v1/fp_store',{method:'POST',headers:{...hdrs(cfg),'Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id:1,data:syncBody(),version:1})});
  SYNC.syncedVer=1;
}
async function pushSync(retry){
  const cfg=getCfg();if(!cfg)return;
  try{
    const r=await fetch(cfg.url+'/rest/v1/fp_store?id=eq.1&select=data,version',{headers:hdrs(cfg)});
    const rows=await r.json();
    if(!rows.length){await pushInit(cfg);return;}
    const merged=mergeDB(DB,rows[0].data);
    DB=merged;saveLocal();
    const newVer=rows[0].version+1;
    const p=await fetch(cfg.url+'/rest/v1/fp_store?id=eq.1&version=eq.'+rows[0].version,{method:'PATCH',headers:{...hdrs(cfg),'Prefer':'return=representation'},body:JSON.stringify({data:syncBody(),version:newVer})});
    const res=await p.json();
    if(Array.isArray(res)&&res.length){SYNC.syncedVer=newVer;SYNC.state='on';}
    else if(!retry){await pushSync(true);return;}
  }catch(e){SYNC.state='err';}
  updateSyncDot();
}
function schedulePush(){
  if(!getCfg())return;
  clearTimeout(SYNC.pushTimer);

    <button class="btn ghost small" onclick="openReminder()">📩 수업 안내문</button>
    <button class="btn ghost small" onclick="openBookLink()">🔗 회원 예약 링크</button>
    <button class="btn ghost small" onclick="copyPrevWeek()">지난주 복사</button>
    <button class="btn small" onclick="openAddSession('${days[SCHED.dayIdx]}','','')">+ 세션</button>
  </div>`;
  let grid;
  if(SCHED.mode==='week'){
    const tf=SCHED.trainerFilter;
    const weekSessions=DB.sessions.filter(s=>days.includes(s.date)&&(!tf||s.trainer===tf));
    grid=`<div class="sched-wrap"><table class="sched">
    <thead><tr><th>시간</th>${days.map((d,i)=>`<th style="${d===today()?'background:var(--brand-soft)':''}">${korDate(d)}${dutyBadge(i)}</th>`).join('')}</tr></thead>
    <tbody>${HOURS.map(h=>`<tr><td class="time">${h}:00</td>${days.map(d=>{
      const list=weekSessions.filter(s=>s.date===d&&s.hour===h).sort((a,b)=>a.trainer.localeCompare(b.trainer,'ko'));
      const blocked=tf&&isBlocked(tf,d,h);
      return `<td class="${blocked?'blocked':''} ${d<today()?'past-col':''}" onclick="${blocked?'':'openAddSession(\''+d+'\','+h+',\''+esc(tf)+'\')'}">${list.map(s=>chipHTML(s,O(s),!tf)).join('')}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="note" style="margin-top:10px">주간 전체 보기 — 칩 왼쪽 색상과 이니셜이 담당 코치입니다(예: <b>김강</b>·박익규). 날짜 아래는 당직(오전 9~16 / 오후 16~23). 특정 코치만 보려면 코치 필터를 선택하세요. 빗금 칸은 수업 불가 시간입니다.</div>`;
  }else{
    const date=days[SCHED.dayIdx];
    const daySessions=DB.sessions.filter(s=>s.date===date);
    grid=`<div class="day-tabs" style="margin-bottom:10px">${days.map((d,i)=>`<button class="${i===SCHED.dayIdx?'on':''}" onclick="SCHED.dayIdx=${i};render()">${korDate(d)}</button>`).join('')}</div>
    <div class="sched-wrap"><table class="sched">
    <thead><tr><th>시간</th>${DB.trainers.map(t=>{const du=dutyOf(SCHED.dayIdx);const marks=(du.am===t?' ☀':'')+(du.pm===t?' 🌙':'');return `<th style="box-shadow:inset 0 -3px 0 ${tMeta(t).color}">${esc(t)}<span title="당직">${marks}</span></th>`;}).join('')}</tr></thead>
    <tbody>${HOURS.map(h=>`<tr><td class="time">${h}:00</td>${DB.trainers.map(t=>{
      const list=daySessions.filter(s=>s.trainer===t&&s.hour===h);
      const blocked=isBlocked(t,date,h);
      return `<td class="${blocked?'blocked':''}" onclick="${blocked?'':'openAddSession(\''+date+'\','+h+',\''+esc(t)+'\')'}">${list.map(s=>chipHTML(s,O(s),false)).join('')}</td>`;
    }).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return controls+grid+`<div class="note" style="margin-top:10px">회차 번호는 <b>기록에서 자동 계산</b>됩니다 — 예약(파란 점선)=예상 회차, <b>완료(초록)·노쇼(빨강)</b>=확정 차감, <b>⚠ 주황=12시간 이내 취소(차감 판단 대기)</b>. 칩 클릭으로 상태 변경.</div>`;
}
function copyPrevWeek(){
  const prev=[...Array(7)].map((_,i)=>addDays(SCHED.week,i-7));
  const cur=[...Array(7)].map((_,i)=>addDays(SCHED.week,i));
  let added=0,skipped=0;
  prev.forEach((pd,i)=>{
    DB.sessions.filter(s=>s.date===pd&&!['cancelled','late_cancel'].includes(s.status)).forEach(s=>{
      const m=DB.members.find(x=>x.id===s.memberId);
      if(!m||m.status!=='active'){skipped++;return;}
      if(DB.sessions.find(x=>x.date===cur[i]&&x.hour===s.hour&&x.memberId===s.memberId)){skipped++;return;}
      const booked=memberSessions(m.id).filter(x=>x.status==='booked').length;
      if(remainOf(m)-booked<=0){skipped++;return;}
      DB.sessions.push({id:uid(),memberId:s.memberId,trainer:s.trainer,date:cur[i],hour:s.hour,status:'booked',updatedAt:now()});
      added++;
    });
  });
  save();render();
  alert(`지난주 세션 ${added}건을 예약으로 복사했습니다.`+(skipped?`\n(중복·잔여 부족·비활성 ${skipped}건 제외 — 회차는 자동 재계산되므로 안전)`:''));
}
function openAddSession(date,hour,trainer){
  trainer=(trainer&&DB.trainers.includes(trainer))?trainer:(SCHED.trainerFilter||DB.trainers[0]||'');
  openModal(`
  <h3>세션 추가 — ${korDate(date)}</h3>
  <div class="frm">
    <div><label>담당 코치</label><select id="as-trainer" onchange="asFillMembers()">${DB.trainers.map(t=>`<option ${t===trainer?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div style="display:flex;align-items:flex-end;padding-bottom:8px"><label style="display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer;margin:0;color:var(--sub)"><input type="checkbox" id="as-all" onchange="asFillMembers()" style="width:auto">다른 코치 회원도 표시</label></div>
    <div class="full"><label>회원 — 선택한 코치의 회원만 표시 (잔여횟수 자동 계산)</label>
      <select id="as-member" onchange="asPreview()"></select></div>
    <div><label>날짜</label><input type="date" id="as-date" value="${date}"></div>
    <div><label>시간</label><select id="as-hour">${HOURS.map(h=>`<option value="${h}" ${h===+hour?'selected':''}>${h}:00</option>`).join('')}</select></div>
    <div class="full"><label>매주 반복 (복붙 대신)</label><select id="as-repeat"><option value="1">반복 없음</option><option value="2">2주</option><option value="4">4주</option><option value="8">8주</option><option value="12">12주</option></select></div>
    <div class="full" id="as-preview"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button><button class="btn" onclick="addSession()">예약 추가</button></div>`);
  asFillMembers();
}
function asFillMembers(){
  const t=document.getElementById('as-trainer').value;
  const all=document.getElementById('as-all').checked;
  const sel=document.getElementById('as-member');
  const list=DB.members.filter(m=>m.status==='active'&&(all||m.trainer===t)).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  sel.innerHTML='<option value="">회원 선택…</option>'+list.map(m=>`<option value="${m.id}">${esc(m.name)}${all?' · '+esc(m.trainer):''} · ${usedOf(m)}/${totalOf(m)} (잔여 ${remainOf(m)})</option>`).join('');
  document.getElementById('as-preview').innerHTML=list.length?'':'<div class="note warn">이 코치의 활성 회원이 없습니다. "다른 코치 회원도 표시"를 체크해 보세요.</div>';
}
function asPreview(){
  const mid=document.getElementById('as-member').value;const box=document.getElementById('as-preview');
  if(!mid){box.innerHTML='';return;}
  const m=DB.members.find(x=>x.id===mid);
  const booked=memberSessions(mid).filter(s=>s.status==='booked').length;
  const rem=remainOf(m)-booked;
  box.innerHTML=rem<=0
    ?`<div class="note bad">⚠ ${esc(m.name)}님 잔여 횟수 없음 (사용 ${usedOf(m)}/${totalOf(m)}, 예약 대기 ${booked}). 재등록 결제를 먼저 등록해 주세요.</div>`
    :`<div class="note">예상 회차: <b>${usedOf(m)+booked+1} / ${totalOf(m)}</b> · 예약 후 잔여 ${rem-1}회 ${rem<=3?'<span class="badge b-warn">재등록 골든타임</span>':''}</div>`;
}
function addSession(){
  const mid=document.getElementById('as-member').value;
  if(!mid){alert('회원을 선택해 주세요.');return;}
  const m=DB.members.find(x=>x.id===mid);
  const date=document.getElementById('as-date').value;
  const hour=+document.getElementById('as-hour').value;
  const trainer=document.getElementById('as-trainer').value;
  const rep=+document.getElementById('as-repeat').value;
  if(isBlocked(trainer,date,hour)&&!confirm(`${trainer} 코치의 수업 불가 시간입니다. 그래도 추가할까요?`))return;
  const booked=memberSessions(mid).filter(s=>s.status==='booked').length;
  let can=remainOf(m)-booked;
  if(can<=0&&!confirm(`${m.name}님 잔여 횟수가 없습니다. 그래도 예약할까요? (재등록 예정)`))return;
  let added=0;
  for(let i=0;i<rep;i++){
    const d=addDays(date,i*7);
    if(DB.sessions.find(x=>x.date===d&&x.hour===hour&&x.memberId===mid))continue;
    if(rep>1&&can-added<=0)break;
    DB.sessions.push({id:uid(),memberId:mid,trainer,date:d,hour,status:'booked',updatedAt:now()});added++;
  }
  save();closeModal();render();
  if(rep>1)alert(`${added}건 예약 완료 (잔여 한도 내 생성)`);
}
function openSessionMenu(sid){
  const s=DB.sessions.find(x=>x.id===sid);if(!s)return;
  const m=DB.members.find(x=>x.id===s.memberId);
  const o=ordinalMap(s.memberId)[sid];
  const stName={booked:'예약',done:'완료',noshow:'노쇼',cancelled:'취소',late_cancel:'⚠ 늦은 취소 — 차감 판단 대기'}[s.status];
  openModal(`
  <h3>${esc(m?m.name:'?')} — ${korDate(s.date)} ${s.hour}:00</h3>
  <div class="note" style="margin-bottom:12px">상태: <b>${stName}</b> · 회차 ${o?o+' / '+totalOf(m):'—'} · 담당 ${esc(s.trainer)}${s.bookedBy==='member'?' · <span class="badge b-vio">회원 직접 예약</span>':''}<br>완료/노쇼 처리 시 자동 차감 — 이후 예약 회차가 자동으로 다시 계산됩니다.</div>
  ${s.status==='late_cancel'?`<div class="note warn" style="margin-bottom:10px">수업 12시간 이내 취소입니다. 회원과 연락 후 코치 재량으로 결정하세요.</div>`:''}
  <div class="pill-row">
    <button class="btn" onclick="setSession('${sid}','done')">✓ 수업 완료</button>
    <button class="btn danger" onclick="setSession('${sid}','noshow')">✗ 노쇼/차감${DB.noshowDeduct?'':' (차감 OFF)'}</button>
    <button class="btn ghost" onclick="setSession('${sid}','cancelled')">취소 (차감 없음)</button>
    <button class="btn ghost" onclick="setSession('${sid}','booked')">예약으로 되돌리기</button>
    <button class="btn ghost" onclick="delSession('${sid}')">기록 삭제</button>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);
}
function delSession(sid){
  if(!confirm('이 세션 기록을 삭제할까요?'))return;
  DB.sessions=DB.sessions.filter(x=>x.id!==sid);
  DB.deleted.push({id:sid,ts:now()});
  save();closeModal();render();
}
function setSession(sid,st){
  const s=DB.sessions.find(x=>x.id===sid);s.status=st;s.updatedAt=now();save();closeModal();render();
  const m=DB.members.find(x=>x.id===s.memberId);
  if(m&&(st==='done'||st==='noshow')&&remainOf(m)===3)setTimeout(()=>alert(`🔔 ${m.name}님 잔여 3회 — 재등록 골든타임. [재등록 관리]에 자동 등록되었습니다.`),50);
}

/* ---- 코치 추가 / 퇴사 인수인계 ---- */
function addTrainer(){
  const v=document.getElementById('new-trainer').value.trim();
  if(!v)return;
  if(DB.trainers.includes(v)){alert('이미 있는 이름입니다.');return;}
  DB.trainers.push(v);tMeta(v);DB.metaTs=now();
  addEvent('staff',v+' 코치가 추가되었습니다');
  save();render();
}
function removeTrainer(i){
  const t=DB.trainers[i];
  const mems=DB.members.filter(m=>m.trainer===t&&m.status!=='ended');
  const futs=DB.sessions.filter(s=>s.trainer===t&&s.status==='booked');
  if(!mems.length&&!futs.length){
    if(confirm(t+' 코치를 목록에서 제거할까요? (과거 수업 기록·통계는 그대로 보존됩니다)')){
      DB.trainers.splice(i,1);
      for(const k in (DB.duty||{})){if(DB.duty[k].am===t)DB.duty[k].am='';if(DB.duty[k].pm===t)DB.duty[k].pm='';}
      DB.blocks=DB.blocks.filter(b=>b.trainer!==t);
      DB.metaTs=now();save();render();
    }
    return;
  }
  openHandover(t);
}
function openHandover(t){
  const others=DB.trainers.filter(x=>x!==t);
  if(!others.length){alert('인수받을 코치가 없습니다. 먼저 새 코치를 추가해 주세요.');return;}
  const mems=DB.members.filter(m=>m.trainer===t&&m.status!=='ended').sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  openModal(`
  <h3>${esc(t)} 코치 퇴사 — 회원 인수인계</h3>
  <div class="note" style="margin-bottom:10px">담당 회원 <b>${mems.length}명</b>과 예약된 수업을 새 코치에게 넘깁니다. 과거 수업 기록·통계는 ${esc(t)} 코치 이름으로 보존되며, 각 회원 메모에 인수인계 이력이 자동 기록됩니다.</div>
  <div style="margin-bottom:8px;font-size:13px">일괄 지정:
    <select id="hv-bulk" onchange="document.querySelectorAll('.hv-sel').forEach(s=>s.value=this.value)">${others.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
    <span style="color:var(--sub);font-size:12px">(회원별로 개별 변경 가능)</span></div>
  <div class="hist" style="max-height:280px"><table><tbody>
  ${mems.map(m=>`<tr><td><b>${esc(m.name)}</b> <span class="mono" style="color:var(--sub)">${usedOf(m)}/${totalOf(m)}</span></td>
  <td style="font-size:11.5px;color:var(--sub)">${esc((m.goal||'').slice(0,22))}</td>
  <td><select class="hv-sel" data-mid="${m.id}">${others.map(o=>`<option>${esc(o)}</option>`).join('')}</select></td></tr>`).join('')}
  </tbody></table></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">취소</button>
  <button class="btn danger" onclick="applyHandover('${esc(t)}')">인수인계 실행 & 퇴사 처리</button></div>`);
}
function applyHandover(t){
  let n=0;
  document.querySelectorAll('.hv-sel').forEach(sel=>{
    const m=DB.members.find(x=>x.id===sel.dataset.mid);if(!m)return;
    const to=sel.value;
    m.trainer=to;m.updatedAt=now();n++;
    m.notes=((m.notes||'')+'\n['+today()+'] '+t+' → '+to+' 인수인계').trim();
    DB.sessions.filter(s=>s.memberId===m.id&&s.status==='booked'&&s.trainer===t).forEach(s=>{s.trainer=to;s.updatedAt=now();});
  });
  const i=DB.trainers.indexOf(t);if(i>=0)DB.trainers.splice(i,1);
  for(const k in (DB.duty||{})){if(DB.duty[k].am===t)DB.duty[k].am='';if(DB.duty[k].pm===t)DB.duty[k].pm='';}
  DB.blocks=DB.blocks.filter(b=>b.trainer!==t);
  DB.metaTs=now();
  addEvent('staff',t+' 코치 퇴사 — 회원 '+n+'명 인수인계 완료');
  save();closeModal();render();
  alert('인수인계 완료. 과거 기록과 통계는 보존됩니다. 당직표를 확인해 주세요.');
}

/* ---- 수업 불가 시간 ---- */
let BLK_TRAINER='';
function openBlocks(){
  BLK_TRAINER=BLK_TRAINER||DB.trainers[0];
  renderBlocks();
}
function renderBlocks(){
  const t=BLK_TRAINER;
  openModal(`
  <h3>🚫 수업 불가 시간 <span style="font-size:12px;color:var(--sub);font-weight:500">— 매주 반복 차단 (회원 예약 불가, 직원은 경고 후 가능)</span></h3>
  <div style="margin-bottom:10px"><select onchange="BLK_TRAINER=this.value;renderBlocks()">${DB.trainers.map(x=>`<option ${x===t?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div style="overflow-x:auto"><table class="block-grid">
    <tr><th style="width:52px">시간</th>${DAYN.map(d=>`<th style="width:44px">${d}</th>`).join('')}</tr>
    ${HOURS.map(h=>`<tr><th>${h}:00</th>${DAYN.map((d,wd)=>{
      const b=DB.blocks.some(x=>x.trainer===t&&x.weekday===wd&&!x.date&&x.hour===h);
      return `<td class="${b?'b':''}" onclick="toggleBlock(${wd},${h})">${b?'✕':''}</td>`;
    }).join('')}</tr>`).join('')}
  </table></div>
  <h4 style="margin:14px 0 6px;font-size:13px">특정 날짜만 차단 <span style="font-weight:500;color:var(--sub);font-size:12px">— 휴가·세미나 등 일회성 (회원 예약 불가)</span></h4>
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <input type="date" id="bd-date" value="${today()}">
    <select id="bd-from">${HOURS.map(x=>`<option value="${x}">${x}:00</option>`).join('')}</select>
    ~ <select id="bd-to">${HOURS.map(x=>`<option value="${x}" ${x===22?'selected':''}>${x}:00</option>`).join('')}</select>
    <button class="btn small" onclick="addDateBlock()">차단 추가</button>
  </div>
  <div class="pill-row" style="margin-top:8px">
    ${DB.blocks.filter(b=>b.trainer===t&&b.date).sort((a,b)=>(a.date+String(a.hour).padStart(2,'0')).localeCompare(b.date+String(b.hour).padStart(2,'0'))).map(b=>`<span class="trainer-tag">${korDate(b.date)} ${b.hour}시 <b onclick="delBlock('${b.id}')">✕</b></span>`).join('')||'<span style="font-size:12px;color:var(--sub)">등록된 일회성 차단 없음</span>'}
  </div>
  <div class="modal-actions"><button class="btn" onclick="closeModal();render()">완료</button></div>`);
}
function addDateBlock(){
  const t=BLK_TRAINER;
  const d=document.getElementById('bd-date').value;
  const from=+document.getElementById('bd-from').value,to=+document.getElementById('bd-to').value;
  if(!d||to<from){alert('날짜와 시간 범위를 확인해 주세요.');return;}
  for(let hh=from;hh<=to;hh++){
    if(!DB.blocks.some(b=>b.trainer===t&&b.date===d&&b.hour===hh))
      DB.blocks.push({id:uid(),trainer:t,date:d,hour:hh,updatedAt:now()});
  }
  save();renderBlocks();
}
function delBlock(id){
  const i=DB.blocks.findIndex(b=>b.id===id);
  if(i>=0){DB.deleted.push({id,ts:now()});DB.blocks.splice(i,1);save();renderBlocks();}
}
function toggleBlock(wd,h){
  const t=BLK_TRAINER;
  const i=DB.blocks.findIndex(x=>x.trainer===t&&x.weekday===wd&&!x.date&&x.hour===h);
  if(i>=0){DB.deleted.push({id:DB.blocks[i].id,ts:now()});DB.blocks.splice(i,1);}
  else DB.blocks.push({id:uid(),trainer:t,weekday:wd,hour:h,updatedAt:now()});
  save();renderBlocks();
}

function delMember(mid){
  if(!confirm('회원과 모든 세션 기록을 삭제할까요? 되돌릴 수 없습니다.'))return;
  DB.deleted.push({id:mid,ts:now()});
  memberSessions(mid).forEach(s=>DB.deleted.push({id:s.id,ts:now()}));
  DB.members=DB.members.filter(x=>x.id!==mid);
  DB.sessions=DB.sessions.filter(s=>s.memberId!==mid);
  save();closeModal();render();
}
function mfPerCalc(){const c=+document.getElementById('mf-count').value||0,a=+document.getElementById('mf-amount').value||0;if(c&&a)document.getElementById('mf-per').value=Math.round(a/c*0.5);}
function saveMember(mid){
  const name=document.getElementById('mf-name').value.trim();
  if(!name){alert('이름을 입력해 주세요.');return;}
  const base={name,phone:document.getElementById('mf-phone').value.trim(),trainer:document.getElementById('mf-trainer').value,
    program:document.getElementById('mf-program').value,status:document.getElementById('mf-status').value,
    referredBy:document.getElementById('mf-ref').value.trim(),pref:document.getElementById('mf-pref').value.trim(),
    goal:document.getElementById('mf-goal').value.trim(),notes:document.getElementById('mf-notes').value.trim(),updatedAt:now()};
  if(mid){const mm=DB.members.find(x=>x.id===mid);Object.assign(mm,base);const cv=document.getElementById('mf-carry');if(cv)mm.carryUsed=Math.max(0,+cv.value||0);}
  else{
    const count=+document.getElementById('mf-count').value||0;
    if(!count){alert('첫 등록 횟수를 입력해 주세요.');return;}
    const per=+document.getElementById('mf-per').value||0;
    const amount=+document.getElementById('mf-amount').value||count*per;
    DB.members.push({id:uid(),...base,carryUsed:+document.getElementById('mf-carry').value||0,followUp:{status:'대기',memo:''},
      packages:[{id:uid(),date:document.getElementById('mf-pdate').value||today(),count,perPrice:per,amount}]});
  }
  save();closeModal();render();
}

function pkPerCalc(){const c=+document.getElementById('pk-count').value||0,a=+document.getElementById('pk-amount').value||0;if(c&&a)document.getElementById('pk-per').value=Math.round(a/c*0.5);}
function editPackage(mid,pid){

  <h3>${esc(m.name)} — 결제 수정</h3>

function updatePackage(mid,pid){
  const m=DB.members.find(x=>x.id===mid);const p=m.packages.find(x=>x.id===pid);
  const c=+document.getElementById('pk-count').value||0;
  if(!c){alert('횟수를 입력해 주세요.');return;}
  p.count=c;p.perPrice=+document.getElementById('pk-per').value||0;
  p.amount=+document.getElementById('pk-amount').value||0;
  p.date=document.getElementById('pk-date').value;
  m.updatedAt=now();
  addEvent('staff',m.name+'님 결제 내역 수정 ('+c+'회)');
  save();openMember(mid);
}
function deletePackage(mid,pid){
  const m=DB.members.find(x=>x.id===mid);const p=m.packages.find(x=>x.id===pid);if(!p)return;
  if(m.packages.length<=1){alert('마지막 결제(패키지)는 삭제할 수 없습니다. 대신 [수정]으로 내용을 고치세요.');return;}
  if(!confirm(p.count+'회 ('+fmtW(p.amount)+') 결제를 삭제할까요? 총 횟수가 '+(totalOf(m)-p.count)+'회로 줄어듭니다.'))return;
  m.packages=m.packages.filter(x=>x.id!==pid);
  m.updatedAt=now();
  addEvent('staff',m.name+'님 결제 내역 삭제 ('+p.count+'회)');
  save();openMember(mid);
}

/* ================= 재등록 관리 ================= */
function viewRenew(){
  const golden=goldenList(),expired=expiredList();
  const mk=today().slice(0,7);
  const renewed=DB.members.filter(m=>(m.packages||[]).some((p,i)=>i>0&&monthKey(p.date)===mk));
  const churned=DB.members.filter(m=>m.status==='ended');
  function row(m){
    const f=m.followUp||{status:'대기',memo:''};
    return `<tr>
      <td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td>
      <td>${esc(m.trainer)}</td>
      <td class="mono" style="font-weight:700">${usedOf(m)}/${totalOf(m)}</td>
      <td>${remainOf(m)<=0?'<span class="badge b-bad">만료</span>':`<span class="badge b-warn">${remainOf(m)}회</span>`}</td>
      <td>${esc(m.pref||'-')}</td>
      <td><select onchange="setFollow('${m.id}','status',this.value)">${FOLLOW.map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select></td>
      <td><input value="${esc(f.memo||'')}" placeholder="메모" onchange="setFollow('${m.id}','memo',this.value)" style="width:100%"></td>
      <td><button class="btn small" onclick="addPackage('${m.id}')">결제</button></td>
    </tr>`;
  }
  return `
  <div class="note" style="margin-bottom:14px"><b>재등록 플레이북</b> — 잔여 3회 도달 시 자동으로 올라옵니다. ① 잔여 3회: 성과 리뷰 + 재등록 안내 → ② 잔여 1회: 결제 확정 → ③ 만료 후 7일 내 미등록 시 이탈 처리·사유 기록. <b>시스템이 타이밍을 알려주는 구조</b>입니다.</div>
  <div class="card"><h2>🔔 재등록 골든타임 <span class="hint">잔여 3회 이하 — 자동 추출</span></h2>
    ${golden.length||expired.length?`<table><thead><tr><th>회원</th><th>담당</th><th>진행</th><th>잔여</th><th>가능 시간</th><th>팔로업</th><th>메모</th><th></th></tr></thead>
    <tbody>${expired.map(row).join('')}${golden.sort((a,b)=>remainOf(a)-remainOf(b)).map(row).join('')}</tbody></table>`
    :'<div class="empty">재등록 임박 회원 없음</div>'}
  </div>
  <div class="two-col">
    <div class="card"><h2>이번 달 재등록 완료 <span class="hint">${mk}</span></h2>
      ${renewed.length?`<table><tbody>${renewed.map(m=>{const p=(m.packages||[]).filter((x,i)=>i>0&&monthKey(x.date)===mk);return `<tr><td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td><td>${esc(m.trainer)}</td><td class="mono">${p.map(x=>x.count+'회 · '+fmtW(x.amount)).join(', ')}</td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">이번 달 재등록 없음</div>'}
    </div>
    <div class="card"><h2>이탈 회원</h2>
      ${churned.length?`<table><tbody>${churned.map(m=>`<tr><td class="clickable" onclick="openMember('${m.id}')"><b>${esc(m.name)}</b></td><td>${esc(m.trainer)}</td><td class="mono">${usedOf(m)}/${totalOf(m)}</td><td style="color:var(--sub);font-size:12px">${esc((m.followUp||{}).memo||m.notes||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">이탈 기록 없음</div>'}
    </div>
  </div>`;
}
function setFollow(mid,k,v){const m=DB.members.find(x=>x.id===mid);m.followUp=m.followUp||{status:'대기',memo:''};m.followUp[k]=v;m.updatedAt=now();if(k==='status'&&v==='이탈')m.status='ended';save();render();}

async function connectSB(){
  const url=document.getElementById('sb-url').value.trim();
  const key=document.getElementById('sb-key').value.trim();
  if(!url||!key){alert('URL과 anon 키를 입력해 주세요.');return;}
  setCfg(url,key);
  try{
    const cfg=getCfg();
    const r=await fetch(cfg.url+'/rest/v1/fp_store?id=eq.1&select=version',{headers:hdrs(cfg)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rows=await r.json();
    if(!rows.length){await pushInit(cfg);alert('연결 성공! 현재 데이터를 서버에 올렸습니다.');}
    else{
      if(confirm('서버에 기존 데이터가 있습니다. 서버 데이터와 병합할까요?')){await pullSync(true);}
      alert('연결 성공!');
    }
    SYNC.state='on';
  }catch(e){alert('연결 실패: '+e.message+'\nURL/키와 SQL 실행 여부를 확인해 주세요.');SYNC.state='err';}
  render();
}
function exportJSON(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}));
  a.download='퍼스트피지오_백업_'+today()+'.json';a.click();
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.members||!d.sessions)throw 0;if(confirm('가져온 데이터로 교체할까요?')){DB=d;DB.blocks=DB.blocks||[];DB.events=DB.events||[];DB.deleted=DB.deleted||[];save();render();alert('완료');}}catch(e){alert('올바른 백업 파일이 아닙니다.');}};
  r.readAsText(f);
}

          const blocked=isBlocked(coach,d,h);
          const closed=hoursUntil(d,h)<BOOK_LEAD_HOURS;
          let cls='open',fn=`memberBook('${d}',${h})`;
          if(mine){cls='mine';fn=`memberCancel('${mine.id}')`;}
          else if(blocked){cls='blockedS';fn='';}
          else if(taken){cls='taken';fn='';}
          else if(closed){cls='closed';fn='';}
          return `<button class="slot ${cls}" ${fn?`onclick="${fn}"`:'disabled'}>${h}:00</button>`;
        }).join('');
        return `<div class="slot-day"><div class="d">${korDate(d)}${d===today()?' · 오늘':''}</div><div class="slots">${slots}</div></div>`;
      }).join('')}
      <button class="btn ghost" style="width:100%;margin-top:6px" onclick="BK.weeks+=1;render()">더 보기 (+1주)</button>
    </div>
    <div class="note">
      <b>예약·취소 안내</b><br>
      · 수업 시작 <b>12시간 전까지</b> 자유롭게 예약·취소하실 수 있습니다.<br>
      · 수업 시작 12시간 이내 취소는 <b>횟수가 차감될 수 있습니다</b> (부득이한 사정은 코치에게 연락 주시면 확인 후 조정해 드립니다).<br>
      · 수업 시작 12시간 이내에는 새 예약이 불가합니다. 급한 경우 코치에게 직접 연락해 주세요.
    </div>
    <div style="margin-top:10px;text-align:center"><button class="btn ghost small" onclick="BK.memberId='';render()">다른 회원 선택</button></div>`;
  }
  app.innerHTML=`<div class="book-wrap">
    <div class="book-hd"><h1>FIRST <span>PHYSIO</span> 수업 예약</h1>
    <div style="font-size:12px;color:var(--sub);margin-top:4px" id="bk-sync">${cfg?'실시간 예약 시스템':'서버 미연결'}</div></div>
    ${body}</div>`;
}
async function memberBook(date,hour){
  await pullSync(true);
  const me=DB.members.find(m=>m.id===BK.memberId);const coach=BK.coach;
  if(hoursUntil(date,hour)<BOOK_LEAD_HOURS){alert('수업 시작 12시간 이내에는 예약할 수 없습니다. 코치에게 직접 연락해 주세요.');render();return;}
  if(isBlocked(coach,date,hour)||DB.sessions.find(s=>s.date===date&&s.hour===hour&&s.trainer===coach&&['booked','done'].includes(s.status))){alert('방금 다른 예약이 들어왔거나 불가한 시간입니다. 다른 시간을 선택해 주세요.');render();return;}
  const myBooked=memberSessions(me.id).filter(s=>s.status==='booked').length;
  if(remainOf(me)-myBooked<=0){alert('잔여 횟수가 없습니다. 재등록 후 예약해 주세요.');return;}
  if(!confirm(`${korDate(date)} ${hour}:00 수업을 예약할까요?`))return;
  DB.sessions.push({id:uid(),memberId:me.id,trainer:coach,date,hour,status:'booked',bookedBy:'member',updatedAt:now()});
  addEvent('book',`${me.name}님이 ${korDate(date)} ${hour}시 수업을 예약했습니다 (${coach} 코치)`);
  saveLocal();await pushSync(false);
  alert('예약 완료! 수업 전날 안내 연락을 드립니다.');render();
}
async function memberCancel(sid){
  await pullSync(true);
  const s=DB.sessions.find(x=>x.id===sid);if(!s){render();return;}
  const me=DB.members.find(m=>m.id===s.memberId);
  const hrs=hoursUntil(s.date,s.hour);
  if(hrs<CANCEL_HOURS){
    if(!confirm(`수업 시작 12시간 이내 취소입니다.\n횟수가 차감될 수 있으며, 부득이한 사정은 코치 확인 후 조정됩니다.\n그래도 취소할까요?`))return;
    s.status='late_cancel';s.updatedAt=now();
    addEvent('late_cancel',`⚠ ${me.name}님이 ${korDate(s.date)} ${s.hour}시 수업을 12시간 이내 취소 — 차감 여부 판단 필요 (${s.trainer} 코치)`);
  }else{
    if(!confirm(`${korDate(s.date)} ${s.hour}:00 예약을 취소할까요? (차감 없음)`))return;
    s.status='cancelled';s.updatedAt=now();
    addEvent('cancel',`${me.name}님이 ${korDate(s.date)} ${s.hour}시 수업을 취소했습니다 (${s.trainer} 코치)`);
  }
  saveLocal();await pushSync(false);
  alert('취소되었습니다.');render();
}

/* ================= 모달 ================= */
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('overlay').classList.add('show');}
function closeModal(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

/* ================= 시작 ================= */
load();
render();
pullSync(false);
setInterval(()=>pullSync(false),15000);
</script>
